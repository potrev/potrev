.iq-angka{display:flex;align-items:center;gap:3mm}
.iq-angka>b{font:800 25pt/1 "Plus Jakarta Sans",Arial,sans-serif;color:#132449;letter-spacing:-.03em}
.iq-angka div{display:flex;flex-direction:column;gap:.8mm}
.iq-angka .chip-lv{font-size:8pt;padding:.6mm 2.4mm}
.iq-angka small{font-size:7pt;color:#556074}
.iq-skala{position:relative;display:flex;height:2.4mm;gap:.35mm;margin-top:1mm}
.iq-skala i{display:block;height:100%;border-radius:.6mm;opacity:.32}
.iq-skala i.aktif{opacity:1}
.iq-skala i.lv0{background:#B5432F}.iq-skala i.lv1{background:#E08A2E}.iq-skala i.lv2{background:#7C8AA5}.iq-skala i.lv3{background:#2E8A6A}.iq-skala i.lv4{background:#1C6B4F}
.iq-tanda{position:absolute;top:-1.1mm;width:1.2mm;height:4.6mm;margin-left:-.6mm;border-radius:.6mm;background:#132449;box-shadow:0 0 0 .4mm #fff}
.iq-tik{position:relative;height:3mm;font:500 6.4pt "Plus Jakarta Sans",Arial,sans-serif;color:#6B7588}
.iq-tik span{position:absolute;transform:translateX(-50%)}
.iq-ket{font-size:7pt;color:#556074;line-height:1.35}
.skor{border:.25mm solid #DDE3EE;border-radius:4.2mm;padding:2.6mm 3mm 2.2mm;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge{width:44mm;display:block}
.dengan-iq .gauge{width:36mm}
.gg-latar{fill:none;stroke:#E6EAF2;stroke-width:13;stroke-linecap:round}
.gg-isi{fill:none;stroke:#2240B0;stroke-width:13;stroke-linecap:round}
.gg-titik{fill:#fff;stroke:#2240B0;stroke-width:3}
.gg-tik{font:500 9px "Plus Jakarta Sans",Arial,sans-serif;fill:#6B7588}
.gg-nilai{font:800 30px "Plus Jakarta Sans",Arial,sans-serif;fill:#132449}
.gg-ket{font:600 9.5px "Plus Jakarta Sans",Arial,sans-serif;fill:#556074;letter-spacing:0;text-transform:none}
.skor-rinci{display:grid;grid-template-columns:1fr 1fr;gap:2mm;width:100%;border-top:.25mm solid #DDE3EE;padding-top:1.8mm;margin-top:.6mm}
.skor-rinci div{display:flex;flex-direction:column;align-items:center;text-align:center}
.skor-rinci b{font:800 11.5pt/1.1 "Plus Jakarta Sans",Arial,sans-serif;color:#132449}
.skor-rinci span{font-size:6.8pt;color:#556074;line-height:1.25}
.kartu-l{border:.25mm solid #DDE3EE;border-radius:4.2mm;padding:3mm 4mm 3.2mm}
.kartu-l-kepala{display:flex;justify-content:space-between;align-items:center;gap:3mm;margin-bottom:1.8mm;flex-wrap:wrap}
.kartu-l-kepala h3{font-size:9.8pt;font-weight:700}
.leg-rel{display:flex;flex-wrap:wrap;gap:1mm 3.2mm;font-size:7pt;color:#556074}
.leg-rel i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.6mm;margin-right:1mm;vertical-align:-.35mm}
.leg-rel i.lebih,.pf-isi.lebih,.titik.lebih{background:#1E7A55}
.leg-rel i.sesuai,.pf-isi.sesuai,.titik.sesuai{background:#2240B0}
.leg-rel i.kurang,.pf-isi.kurang,.titik.kurang{background:#E08A2E}
.leg-rel i.std{width:0;height:3mm;border-left:.45mm dashed #132449;border-radius:0}
.pf{--n:5;display:flex;flex-direction:column;gap:1.15mm}
.pf-ranah{font:700 7.4pt "Plus Jakarta Sans",Arial,sans-serif;color:#2240B0;padding:1.2mm 0 .2mm;border-bottom:.2mm solid #E3E8F0;margin-bottom:.2mm}
.pf-baris{display:grid;grid-template-columns:56mm 1fr 8mm;gap:3mm;align-items:center}
.pf-kepala{font:600 7.5pt "Plus Jakarta Sans",Arial,sans-serif;color:#556074;text-transform:none;letter-spacing:0}
.pf-skala{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.pf-skala span{text-align:center;text-transform:none;letter-spacing:0;font-weight:700;color:#44506A}
.pf-skala small{font-weight:500;color:#6B7588;margin-left:.8mm}
.pf-nama{font-weight:600;font-size:8.1pt;line-height:1.25}
.pf-trek{position:relative;height:3.7mm}
.pf-latar{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:.45mm;border-radius:1.8mm;overflow:hidden}
.pf-latar i{display:block;background:#EEF1F6}
.pf-isi{position:absolute;left:0;top:0;bottom:0;border-radius:1.8mm;z-index:1}
.pf-std{position:absolute;z-index:2;top:-1.1mm;bottom:-1.1mm;width:0;border-left:.45mm dashed #132449;margin-left:-.22mm}
.pf-skor{display:flex;align-items:baseline;justify-content:flex-end}
.pf-isi.abaikan,.titik.abaikan,.leg-rel i.abaikan{background:#AEB6C4}
.pf-skor.abaikan{color:#8A94A6}
.tanda-asp{display:inline-block;margin-left:1.6mm;padding:0 1.3mm;border-radius:1.6mm;font:600 6.1pt/1.5 "Plus Jakarta Sans",Arial,sans-serif;vertical-align:1px;white-space:nowrap;border:.2mm solid #E0B062;color:#8A560F}
.tanda-asp.abu{border-color:#C3CBD9;color:#6B7588}
.pf-skor b{font:800 10pt/1.1 "Plus Jakarta Sans",Arial,sans-serif}
.pf-skor small{font-weight:700;font-size:7.2pt}
.pf-skor.lebih,.sel.lebih{color:#1A6A4B}
.pf-skor.sesuai,.sel.sesuai{color:#2240B0}
.pf-skor.kurang,.sel.kurang{color:#A8630F}
.tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:3.4mm}
.kel{border-radius:4.2mm;padding:2.6mm 3.4mm}
.kel.lebih{background:#E3F3EC}.kel.sesuai{background:#E9EEFC}.kel.kurang{background:#FDF0E1}
.kel-judul{font:700 8.6pt "Plus Jakarta Sans",Arial,sans-serif;color:#132449;display:flex;align-items:center;gap:2mm;margin-bottom:1mm}
.kel-judul span{font:800 13pt/1 "Plus Jakarta Sans",Arial,sans-serif}
.kel-isi{font-size:7.8pt;line-height:1.45;color:#2b3445}
.kel-isi.redup{color:#556074;font-style:italic}
.kel.lebih .kel-judul span{color:#1A6A4B}.kel.sesuai .kel-judul span{color:#2240B0}.kel.kurang .kel-judul span{color:#A8630F}
.kel ul{margin:0;padding-left:4mm;font-size:8.2pt}
.kel li{margin:.7mm 0}
/* Kesimpulan + tanda tangan langsung mengikuti isi di atasnya; sisa ruang ada di bawah halaman. */
.akhir{display:grid;grid-template-columns:1fr 56mm;gap:5mm;align-items:end}
.akhir-kiri{display:flex;flex-direction:column;gap:2.6mm;min-width:0}
.kesimpulan{background:#F5F7FB;border-radius:4.2mm;padding:3.2mm 4.4mm}
.kesimpulan h3{font-size:9.4pt;font-weight:700;margin-bottom:1.2mm}
.kesimpulan p{font-size:8.7pt;line-height:1.45;text-align:justify}
.kesimpulan p+p{margin-top:1.1mm}
.kesimpulan.belum p{color:#6B7588;font-style:italic;text-align:left}
.akhir-bawah{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm}
.int-mini{display:flex;gap:2.6mm;align-items:center;padding:2.2mm 3.4mm;border-radius:3.6mm;font-size:7.6pt;line-height:1.35}
.int-mini b{display:block;font-size:8.3pt}
.int-mini span{color:#556074}
.int-mini.aman{background:#E3F3EC}.int-mini.aman .ik{color:#1E7A55}
.int-mini.catatan{background:#FDF0E1}.int-mini.catatan .ik{color:#C77A1A}
.int-mini.henti{background:#FBE8E4}.int-mini.henti .ik{color:#B5432F}
.int-mini .ik{width:5mm;height:5mm}
.akhir-bawah .int-mini{max-width:90mm}
.ttd{font-size:8.3pt;line-height:1.35}
.ttd-peran{color:#556074;font-size:7.8pt}
.ttd-img{height:19mm;display:flex;align-items:center}
.ttd-img img{max-height:19mm;max-width:54mm}
.ttd-nama{font-weight:700;font-size:9.2pt;color:#132449;border-top:.3mm solid #132449;padding-top:1.2mm}
.ttd-sipp{color:#556074;font-size:7.6pt}
.ttd-tunggu .ttd-img span{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:1.6mm;border:.3mm dashed #C3CBD9;border-radius:3mm;color:#6B7588;font-size:7.4pt;margin:1mm 0}
.ttd-tunggu .ttd-img .ik{width:4mm;height:4mm;color:#8A94A6}
.ttd-tunggu .ttd-nama{border-top-style:dotted;border-top-color:#8A94A6}
/* Bila konten Ringkasan tidak muat, laporan memadatkannya bertahap (lihat rapikanLaporan). */
.hal-ringkas.rapat .hal-isi{gap:3mm}
.hal-ringkas.rapat .pf{gap:.6mm}
.hal-ringkas.rapat .pf-trek{height:3.1mm}
.hal-ringkas.rapat .pf-nama{font-size:7.6pt}
.hal-ringkas.rapat .pf-skor b{font-size:8.8pt}
.hal-ringkas.rapat .pf-ranah{padding-top:.6mm}
.hal-ringkas.rapat .kesimpulan p{font-size:8.1pt;line-height:1.38}
.hal-ringkas.rapat .kel-isi{font-size:7.3pt}
.hal-ringkas.rapat2 .kel.lebih .kel-isi,.hal-ringkas.rapat2 .kel.sesuai .kel-isi{display:none}
.hal-ringkas.rapat2 .kel-judul{margin-bottom:.4mm}
.hal-ringkas.rapat3 .kel-isi{display:none}
.hal-ringkas.rapat3 .kel{padding:1.8mm 3.2mm}
.hal-ringkas.rapat3 .sek{padding-bottom:2mm}
.hal-ringkas.rapat3 .kesimpulan p{font-size:7.8pt}
.hal-ringkas-lanjut .akhir{margin-top:0}
/* Ruang masih lega: profil aspek dibuat lebih lapang. */
.hal-ringkas.longgar .pf{gap:1.9mm}
.hal-ringkas.longgar .pf-trek{height:4.4mm}
.hal-ringkas.longgar .pf-nama{font-size:8.5pt}
.hal-ringkas.longgar .pf-skor b{font-size:11pt}
.hal-ringkas.longgar .pf-ranah{padding-top:1.8mm;margin-bottom:.4mm}
.hal-ringkas.longgar .kel-isi{font-size:8.2pt}


/* Psikogram */
.psg{width:100%;border-collapse:separate;border-spacing:0;font-size:8.5pt}
.psg thead th{background:#132449;color:#fff;padding:1mm 1.6mm;font:700 7.2pt "Plus Jakarta Sans",Arial,sans-serif;text-align:left;vertical-align:bottom}
.psg thead tr:first-child th:first-child{border-radius:3mm 0 0 0}
.psg thead tr:first-child th:last-child{border-radius:0 2mm 0 0}
.psg th.psg-lab{text-align:center;font:500 6.2pt/1.15 "Plus Jakarta Sans",Arial,sans-serif;padding:.3mm .5mm .2mm;opacity:.92;border-left:.2mm solid rgba(255,255,255,.16)}
.psg tr.psg-angka th{text-align:center;font:800 9.6pt/1 "Plus Jakarta Sans",Arial,sans-serif;padding:.8mm 0 1.8mm;border-left:.2mm solid rgba(255,255,255,.16)}
.psg.s5 .psg-sel,.psg.s5 tr.psg-angka th{width:12mm}
.psg.s10 .psg-sel,.psg.s10 tr.psg-angka th{width:8.2mm}
.psg.s10 .titik{width:3.7mm;height:3.7mm}
.psg td{border-bottom:.25mm solid #DDE3EE;padding:1.15mm 1.6mm;vertical-align:middle}
.psg-ranah td{background:#E9EEFC;color:#132449;font:800 8.6pt/1.25 "Plus Jakarta Sans",Arial,sans-serif;letter-spacing:0;text-transform:none;padding:1.1mm 3mm}
.psg .psg-no{width:8mm;text-align:center;color:#556074}
.psg-aspek b{font-weight:700;font-size:8.6pt;line-height:1.25}
.psg-aspek .def{display:block;font-size:7.2pt;color:#556074;margin-top:.2mm;line-height:1.3}
.psg-sel{text-align:center;border-left:.2mm solid #E3E8F0;padding-left:0!important;padding-right:0!important}
.psg td.psg-sel:last-child{border-right:.2mm solid #E3E8F0}
.psg tr.abaikan .psg-aspek b{color:#556074}
.psg-sel.std{background:#DCE5FB}
.titik{display:inline-block;width:4.2mm;height:4.2mm;border-radius:50%;vertical-align:middle;box-shadow:0 0 0 .8mm #fff}
.psg-sel.std .titik{box-shadow:0 0 0 .8mm #DCE5FB}
.psg .psg-skor{width:15mm;text-align:center}
.psg td.psg-skor b{display:block;font:800 11pt/1.1 "Plus Jakarta Sans",Arial,sans-serif;color:#132449}
.sel{font-weight:700;font-size:7pt}
.psg-ringkas{display:grid;grid-template-columns:auto auto auto 1fr;gap:3mm 6mm;align-items:center;background:#F5F7FB;border-radius:4.2mm;padding:3.4mm 4.4mm}
.psg-ringkas .psg-aturan{grid-column:1/-1;font-size:7.6pt;color:#3b4556;border-top:.25mm solid #DDE3EE;padding-top:2.2mm;margin:0}
.psg-ringkas .psg-aturan b{font:700 7.6pt "Plus Jakarta Sans",Arial,sans-serif;color:#132449}
.psg-ringkas .leg-rel span{display:inline;font:400 7pt "Plus Jakarta Sans",Arial,sans-serif;text-transform:none;letter-spacing:0;color:#556074}
.psg-ringkas span{font:600 7.5pt "Plus Jakarta Sans",Arial,sans-serif;text-transform:none;letter-spacing:0;color:#556074;display:block}
.psg-ringkas b{font:800 12pt "Plus Jakarta Sans",Arial,sans-serif;color:#132449}
.psg-ringkas .lebar{justify-self:end}
.psg-ringkas .lebar p{font-size:7pt;color:#556074;margin-top:1.2mm}

/* Tes */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.kpi-kartu{border:.25mm solid #DDE3EE;border-radius:3.6mm;padding:3mm 3.2mm;display:flex;flex-direction:column;gap:.6mm}
.kpi-aspek{font:700 8.4pt "Plus Jakarta Sans",Arial,sans-serif;color:#132449}
.kpi-nilai b{font:800 18pt/1.05 "Plus Jakarta Sans",Arial,sans-serif;color:#132449}
.kpi-nilai small{font-size:7.2pt;color:#556074;margin-left:1mm}
.kpi-skor{font:600 7.3pt "Plus Jakarta Sans",Arial,sans-serif;color:#2240B0;text-transform:none;letter-spacing:0}
.kpi-bawah{display:flex;flex-direction:column;gap:1.4mm;margin-top:1.4mm}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:.8mm}
.meter i{height:1.6mm;border-radius:1.6mm;background:#E6EAF2}
.meter.lv0 i.on{background:#B5432F}.meter.lv1 i.on{background:#E08A2E}.meter.lv2 i.on{background:#7C8AA5}.meter.lv3 i.on{background:#2E8A6A}.meter.lv4 i.on{background:#1C6B4F}
.chip-lv{display:inline-block;align-self:flex-start;padding:.5mm 2.2mm;border-radius:10mm;font:700 7pt "Plus Jakarta Sans",Arial,sans-serif;white-space:nowrap}
.chip-lv.lv0{background:#FBE8E4;color:#9A3423}.chip-lv.lv1{background:#FDF0E1;color:#8A560F}.chip-lv.lv2{background:#EEF1F6;color:#44506A}
.chip-lv.lv3{background:#E3F3EC;color:#1A6A4B}.chip-lv.lv4{background:#D2EDE1;color:#145A40}.chip-lv.lvx{background:#EEF1F6;color:#556074}
.grafik-l{padding-bottom:2mm}
.kurva{width:100%;height:auto;display:block}
.k-grid{stroke:#E8ECF3;stroke-width:1}
.k-lbl{font:500 9px "Plus Jakarta Sans",Arial,sans-serif;fill:#6B7588}
.k-garis{fill:none;stroke:#2240B0;stroke-width:2;stroke-linejoin:round}
.k-titik{fill:#fff;stroke:#2240B0;stroke-width:1.2}
.k-batang{fill:#2240B0}.k-batang.puncak{fill:#1E7A55}.k-batang.rendah{fill:#C2533D}
.k-nilai{font:600 8.5px "Plus Jakarta Sans",Arial,sans-serif;fill:#44506A}
.k-rata{stroke:#E08A2E;stroke-width:1.5;stroke-dasharray:5 4}
.k-tren{stroke:#132449;stroke-width:1.4;opacity:.75}
.k-anot{font:700 9px "Plus Jakarta Sans",Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.k-marg{font:600 8.5px "Plus Jakarta Sans",Arial,sans-serif}
.k-marg.kuat{font:700 10px "Plus Jakarta Sans",Arial,sans-serif}
.k-marg.rata{fill:#A8630F}.k-marg.tren{fill:#132449}
.k-anot.rata{fill:#A8630F}
.k-anot.puncak{fill:#1A6A4B}.k-anot.rendah{fill:#9A3423}
.k-eks{stroke:#fff;stroke-width:1.6}.k-eks.puncak{fill:#1E7A55}.k-eks.rendah{fill:#C2533D}
.info-kurva{display:flex;flex-wrap:wrap;gap:1mm 5mm;font-size:7.8pt;color:#3b4556;margin:-.6mm 0 1.2mm}
.info-kurva b{font-family:"Plus Jakarta Sans",Arial,sans-serif;font-weight:700}
.info-kurva .puncak b{color:#1A6A4B}.info-kurva .rendah b{color:#9A3423}.info-kurva .rata b{color:#A8630F}
.sumbu-x{font-size:6.8pt;color:#6B7588;text-align:right;margin-top:-.6mm}
.leg-kurva{display:flex;flex-wrap:wrap;gap:1mm 3.2mm;font-size:7pt;color:#556074;align-items:center}
.leg-kurva i{display:inline-block;width:5mm;height:0;border-top:.5mm solid #2240B0;margin-right:1.2mm;vertical-align:.6mm}
.leg-kurva i.batang{width:2.6mm;height:2.6mm;border:0;background:#2240B0;border-radius:.5mm;vertical-align:-.3mm}
.leg-kurva i.rata{border-top:.5mm dashed #E08A2E}
.leg-kurva i.tren{border-top-color:#132449}
.leg-kurva i.bulat{width:2.6mm;height:2.6mm;border:0;border-radius:50%;vertical-align:-.3mm}
.leg-kurva i.bulat.puncak,.leg-kurva i.batang.puncak{background:#1E7A55}.leg-kurva i.bulat.rendah,.leg-kurva i.batang.rendah{background:#C2533D}
.interp-lap{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.interp-lap>div{background:#F5F7FB;border-radius:3.6mm;padding:2.8mm 3.4mm}
.il-kepala{display:flex;justify-content:space-between;align-items:center;gap:2mm;margin-bottom:1mm}
.il-kepala h4{font-size:8.8pt;font-weight:700}
.interp-lap p{font-size:8.1pt;line-height:1.42}
.cat-tes{display:flex;gap:2.4mm;align-items:flex-start;font-size:7.9pt;padding:2.5mm 3.4mm;border-radius:3.6mm;margin-top:auto}
.cat-tes.aman{background:#E3F3EC}.cat-tes.aman .ik{color:#1E7A55}
.cat-tes.catatan{background:#FDF0E1}.cat-tes.catatan .ik{color:#C77A1A}
.cat-tes.henti{background:#FBE8E4}.cat-tes.henti .ik{color:#B5432F}
.lajur-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:1.6mm}
.lj{position:relative;height:14.5mm;border-radius:1.8mm;display:flex;align-items:center;justify-content:center;color:#1B2433}
.lj b{font:800 13pt "Plus Jakarta Sans",Arial,sans-serif}
.lj-no{position:absolute;top:.9mm;left:1.4mm;font:600 6.3pt "Plus Jakarta Sans",Arial,sans-serif;opacity:.75}
.lj-s{position:absolute;top:.8mm;right:.9mm;min-width:3.4mm;text-align:center;font:700 6.6pt/1.45 "Plus Jakarta Sans",Arial,sans-serif;background:#fff;color:#B5432F;border-radius:10mm;padding:0 1mm;box-shadow:0 0 0 .2mm #F0C9C1}
.lj.b0,.leg-lajur i.b0{background:#EEF2FC}.lj.b1,.leg-lajur i.b1{background:#D6E0F8}.lj.b2,.leg-lajur i.b2{background:#AFC2F0}
.lj.b3,.leg-lajur i.b3{background:#6F8EE0}.lj.b4,.leg-lajur i.b4{background:#2E4FC0}
.lj.b3,.lj.b4{color:#fff}
.lj.puncak{box-shadow:inset 0 0 0 .65mm #F2B544}
.lj.rendah{box-shadow:inset 0 0 0 .65mm #B5432F}
.leg-lajur{display:flex;flex-wrap:wrap;gap:1mm 5mm;font-size:7pt;color:#556074;align-items:center}
.leg-lajur i{display:inline-block;width:3mm;height:3mm;border-radius:.6mm;margin-right:.6mm;vertical-align:-.5mm}
.leg-lajur i.ring{background:#fff;margin-right:1.2mm}
.leg-lajur i.ring.puncak{box-shadow:inset 0 0 0 .55mm #F2B544}
.leg-lajur i.ring.rendah{box-shadow:inset 0 0 0 .55mm #B5432F}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}
.stat-kartu{border:.25mm solid #DDE3EE;border-radius:3.6mm;padding:3mm 3.4mm}
.stat-kartu h3{font-size:9pt;font-weight:700;margin-bottom:1.6mm}
.stat>div{display:flex;justify-content:space-between;gap:2mm;padding:1.25mm 0;border-bottom:.2mm dotted #C3CBD9}
.stat>div:last-child{border-bottom:0}
.stat dt{font-size:7.9pt;color:#556074}
.stat dd{font:600 8.4pt "Plus Jakarta Sans",Arial,sans-serif;color:#1B2433;text-align:right}

/* Integritas */
.status-int{display:flex;gap:4mm;align-items:center;padding:4mm 5mm;border-radius:4.2mm}
.si-ikon{width:11mm;height:11mm;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.si-ikon .ik{width:6mm;height:6mm;color:#fff;stroke-width:2.2}
.si-judul{font:800 12.5pt "Plus Jakarta Sans",Arial,sans-serif}
.status-int p+p{font-size:8.4pt;margin-top:.6mm}
.status-int.aman{background:#E3F3EC}.status-int.aman .si-ikon{background:#1E7A55}.status-int.aman .si-judul{color:#145A40}
.status-int.catatan{background:#FDF0E1}.status-int.catatan .si-ikon{background:#C77A1A}.status-int.catatan .si-judul{color:#7A4A0B}
.status-int.henti{background:#FBE8E4}.status-int.henti .si-ikon{background:#B5432F}.status-int.henti .si-judul{color:#8E2F1F}
.kpi-int{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.kpi-int>div{border:.25mm solid #DDE3EE;border-radius:3.6mm;padding:3mm 3.4mm;display:flex;flex-direction:column;gap:.6mm}
.kpi-int .ik{color:#2240B0;width:4.6mm;height:4.6mm;margin-bottom:.6mm}
.kpi-int b{font:800 14pt/1.1 "Plus Jakarta Sans",Arial,sans-serif;color:#132449}
.kpi-int b.kecil{font-size:9pt;line-height:1.3}
.kpi-int span{font-size:7.2pt;color:#556074}
.aturan-lap{font-size:7.9pt;color:#556074}
.linimasa{list-style:none;margin:0;padding:0}
.linimasa li{display:grid;grid-template-columns:37mm 1fr;gap:3.6mm}
.linimasa time{font:500 7.5pt "Plus Jakarta Sans",Arial,sans-serif;color:#556074;padding-top:.2mm}
.linimasa li>div{position:relative;padding:0 0 3mm 5mm;border-left:.35mm solid #DDE3EE}
.linimasa li:last-child>div{border-left-color:transparent}
.linimasa li>div::before{content:"";position:absolute;left:-1.6mm;top:.8mm;width:2.8mm;height:2.8mm;border-radius:50%;background:#8A94A6;box-shadow:0 0 0 .6mm #fff}
.linimasa b{display:block;font-weight:600;font-size:8.6pt}
.linimasa span{display:block;font-size:7.8pt;color:#556074}
.linimasa .lm-mulai>div::before,.linimasa .lm-selesai>div::before{background:#2240B0}
.linimasa .lm-pelanggaran>div::before,.linimasa .lm-dihentikan>div::before{background:#B5432F}
.linimasa .lm-jeda>div::before,.linimasa .lm-muat-ulang>div::before{background:#E08A2E}
.linimasa .lm-lanjut>div::before,.linimasa .lm-sambung>div::before{background:#1E7A55}

/* Foto */
.foto-lap{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm 3.6mm}
.fl-img{position:relative;aspect-ratio:4/3;border-radius:3.2mm;overflow:hidden;background:#E6EAF2}
.fl-img img{width:100%;height:100%;object-fit:cover;display:block}
.fl-img img:not([src]){visibility:hidden}
.foto-lap figure.pel .fl-img::after{content:"";position:absolute;inset:0;border:.75mm solid #B5432F;border-radius:3.2mm}
.fl-jam{position:absolute;left:1.6mm;bottom:1.6mm;background:rgba(19,36,73,.85);color:#fff;font-size:7pt;font-weight:600;padding:.4mm 1.6mm;border-radius:1.6mm}
.fl-tanda{position:absolute;top:1.6mm;left:1.6mm;background:#B5432F;color:#fff;font:700 6.4pt "Plus Jakarta Sans",Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:.4mm 1.6mm;border-radius:1.6mm}
.foto-lap figcaption{font-size:7.6pt;margin-top:1.4mm;line-height:1.35}
.foto-lap figcaption span{display:block;color:#556074;font-size:7pt}

/* Lampiran */
.surat-lap{display:flex;flex-direction:column;gap:2.8mm;font-size:9pt;text-align:justify}
.judul-surat{font:800 11.5pt "Plus Jakarta Sans",Arial,sans-serif;color:#132449;text-align:center;margin:1mm 0 1.6mm}
.surat-lap .dl-info{text-align:left;padding-left:4mm}
.surat-lap .dl-info>div{grid-template-columns:42mm 1fr}
.surat-ttd{margin-top:2mm}
.surat-ttd .ttd-nama{margin-top:8mm}
.cap-el{display:flex;gap:3mm;align-items:center;align-self:flex-start;border:.35mm solid #2240B0;color:#2240B0;border-radius:3.6mm;padding:2.6mm 3.8mm;text-align:left}
.cap-el .ik{width:6mm;height:6mm}
.cap-el b{display:block;font-size:8.6pt}
.cap-el span{color:#44506A;font-size:7.6pt}

@media (max-width:640px){.lap-wadah{margin-inline:-8px;border-radius:0}}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  body::before{display:none!important}
  html[data-mode] #app{display:block!important;background:none!important}
  .pita,.sisi-nav,.no-print,#layar-tes,#kamera-video,#kunci-peringatan,.laporan-hal > :not(.lap-wadah){display:none!important}
  .wrap{padding:0!important;max-width:none!important;gap:0!important}
  .lap-wadah{background:none;padding:0;gap:0;display:block;border-radius:0;overflow:visible}
  .hal{zoom:1;box-shadow:none;break-after:page;page-break-after:always}
  .hal:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}

.cara-baca{background:#F5F7FB;border-radius:4.2mm;padding:3.6mm 4.4mm}
.cara-baca h3{font-size:9.6pt;font-weight:700;margin-bottom:2.2mm}
.cara-baca dl{display:grid;grid-template-columns:1fr 1fr;gap:2.2mm 6mm}
.cara-baca dl>div{display:grid;grid-template-columns:24mm 1fr;gap:2mm}
.cara-baca dt{font:700 8pt "Plus Jakarta Sans",Arial,sans-serif;color:#2240B0}
.cara-baca dd{font-size:8pt;line-height:1.4}
.cara-baca p{font-size:7.6pt;color:#556074;margin-top:2.6mm;border-top:.25mm solid #DDE3EE;padding-top:2mm}

.cara-baca dl.satu{grid-template-columns:1fr}
.pandu-dua{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm}
.pandu-dua .cara-baca dl>div{grid-template-columns:22mm 1fr}
.t-skala{width:100%;border-collapse:collapse;font-size:8pt}
.t-skala th{text-align:left;font:700 7.5pt "Plus Jakarta Sans",Arial,sans-serif;text-transform:none;letter-spacing:0;color:#556074;padding:1mm 1.6mm;border-bottom:.3mm solid #132449}
.t-skala td{padding:1.1mm 1.6mm;border-bottom:.2mm solid #DDE3EE}
.data-kerja{display:flex;flex-direction:column;gap:1.8mm}
.data-kerja h3{font-size:10pt;font-weight:700}
.data-kerja h3 span{font:500 8pt "Plus Jakarta Sans",Arial,sans-serif;color:#556074;margin-left:1.6mm}
.t-data{width:100%;border-collapse:collapse;table-layout:fixed;font:500 7.4pt "Plus Jakarta Sans",Arial,sans-serif}
.t-data th{width:19mm;text-align:left;font:600 6.8pt "Plus Jakarta Sans",Arial,sans-serif;color:#556074;padding:.8mm 1mm}
.t-data td{text-align:center;padding:.8mm 0;border-left:.2mm solid #E3E8F0}
.t-data tr.dk-no td{color:#8A94A6;font-size:6.6pt;border-bottom:.2mm solid #DDE3EE}
.t-data tr.dk-n td{font-weight:700;color:#132449}
.t-data tr.dk-n td.maks{background:#E3F3EC;color:#145A40}
.t-data tr.dk-n td.min{background:#FBE8E4;color:#8E2F1F}
.t-data tr.dk-s td{color:#B5432F}
.t-data+.t-data{margin-top:1.6mm}

/* gaya baru */
/* header psikogram: tanpa blok, angka dalam lingkaran */
.psg thead th{background:none;color:#132449;border-bottom:.4mm solid #132449}
.psg thead tr:first-child th{border-radius:0!important}.psg thead tr:first-child th.psg-lab{border-bottom:0}
.psg th.psg-lab{border-left:0;color:#556074;opacity:1;font-weight:600;padding-bottom:.6mm;vertical-align:bottom;text-align:center}
.psg tr.psg-angka th{border-left:0;color:#2240B0;font-size:8.8pt;padding:1.2mm 0 1.6mm;background:radial-gradient(circle closest-side at 50% 46%,#E4EAFB 0 2.5mm,transparent 2.6mm) no-repeat}
.psg thead .psg-no{color:#556074}.psg thead .psg-aspek{font-size:8pt}
.hal{font-variant-numeric:tabular-nums;letter-spacing:-.003em}
.hal h1,.hal h2,.hal h3,.hal h4{letter-spacing:-.022em;font-weight:800}

/* Halaman hasil IST */
.ist-ringkas{display:flex;gap:5mm;align-items:stretch;margin:2mm 0 5mm}
.ist-demo{margin:-1mm 0 3mm;padding:1.8mm 4mm;border-radius:3mm;background:#FFF4DC;border:.3mm solid #E9C26B;color:#5A4210;font-size:8.6pt;line-height:1.45}
.ist-demo b{color:#3E2D06}
.ist-iq{flex:none;width:44mm;border-radius:4.2mm;background:#132449;color:#fff;padding:4mm 5mm;display:flex;flex-direction:column;gap:1mm;align-items:flex-start}
.ist-iq span{font:600 8pt/1 "Plus Jakarta Sans",Arial,sans-serif;opacity:.75}
.ist-iq b{font:800 30pt/1 "Plus Jakarta Sans",Arial,sans-serif;letter-spacing:-.03em}
.ist-iq em{font-style:normal;margin-top:1mm}
.ist-ringkas dl{flex:1;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}
.ist-ringkas dl div{border:.25mm solid #D9DFEC;border-radius:3.6mm;padding:3.5mm 4mm;display:flex;flex-direction:column;justify-content:space-between;gap:2mm}
.ist-ringkas dt{font:600 7.6pt/1.2 "Plus Jakarta Sans",Arial,sans-serif;color:#556074}
.ist-ringkas dd{margin:0;font:800 17pt/1 "Plus Jakarta Sans",Arial,sans-serif;color:#132449;letter-spacing:-.02em}
.ist-ringkas dd.kecil{font-size:10.5pt;line-height:1.2}
.ist-ringkas dd small{font:500 7.5pt/1 "Plus Jakarta Sans",Arial,sans-serif;color:#556074;letter-spacing:0}
.ist-tabel td,.ist-tabel th{vertical-align:middle}
.ist-tabel .ist-tg{text-align:center;width:13mm}
.ist-kolom-profil{width:60mm}
.ist-sumbu{position:relative;height:3.4mm;margin:0 10%}
.ist-sumbu span{position:absolute;top:0;transform:translateX(-50%);font-size:6.8pt;font-weight:600}
.ist-profil{position:relative;height:5mm;margin:0 10%;border-radius:5mm;background:linear-gradient(to right,#EEF1F7 0 25%,#E4E9F3 25% 37.5%,#D9E0EE 37.5% 62.5%,#E4E9F3 62.5% 75%,#EEF1F7 75%)}
.ist-profil .tengah{position:absolute;left:50%;top:-1mm;bottom:-1mm;width:.3mm;background:#8C97AD}
.ist-profil .titik{position:absolute;top:50%;width:3.6mm;height:3.6mm;border-radius:50%;transform:translate(-50%,-50%);background:#2240B0;border:.5mm solid #fff;box-shadow:0 0 0 .2mm #132449}
.ist-rinci{display:flex;flex-direction:column;gap:1.2mm}
.ist-rinci div{display:flex;align-items:center;gap:3mm;font-size:7.6pt}
.ist-rinci b{width:8mm;color:#132449}
.ist-rinci span{display:flex;gap:.9mm}
.ist-rinci small{color:#556074;font-size:7pt}
.ist-rinci i,.ist-legenda i{display:inline-block;width:3.4mm;height:3.4mm;border-radius:1mm;background:#EEF1F7;border:.2mm solid #D5DCEA}
.ist-rinci i.benar,.ist-legenda i.benar{background:#1E7B57;border-color:#1E7B57}
.ist-rinci i.benar.dua,.ist-legenda i.benar.dua{background:#0F5A3E;border-color:#0F5A3E;box-shadow:inset 0 0 0 .6mm #7FD3AE}
.ist-rinci i.salah,.ist-legenda i.salah{background:#F3C9C4;border-color:#D9897F}
.ist-legenda{display:flex;gap:5mm;align-items:center;font-size:7.2pt;color:#556074;margin:3mm 0 4mm}
.ist-legenda span{display:inline-flex;align-items:center;gap:1.5mm}
.ist-legenda .kanan{margin-left:auto}
.ist-rinci i.kosong,.ist-legenda i.kosong{background:#fff;border:.25mm dashed #A9B3C8}

/* ===== Laporan DISC ===== */
.disc-skor{margin:1mm 0 5mm}
.disc-skor th.tg,.disc-skor td.tg{text-align:center;width:13mm}
.disc-skor td.tg{font-weight:700;font-size:9.5pt}
.disc-skor td.bintang{background:#132449;color:#fff;font-size:7pt;font-weight:600}
.disc-skor .baris-no{display:inline-grid;place-items:center;width:5.4mm;height:5.4mm;border-radius:50%;background:#132449;color:#fff;font-size:7.4pt;font-weight:700;margin-right:2mm}
.disc-skor small{color:#6A7488;font-weight:500;font-size:7.4pt;display:block;margin-left:7.4mm}
.disc-skor .ok{color:#1E7A55;font-size:7.4pt;font-weight:700}
.disc-grafik{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
.disc-kartu{border:.25mm solid #D9DFEC;border-radius:3.6mm;padding:3.4mm 3.4mm 3.6mm;display:flex;flex-direction:column;gap:2mm}
.disc-kartu.utama{border-color:#2240B0;box-shadow:inset 0 0 0 .25mm #2240B0}
.disc-kartu header{display:flex;flex-direction:column;gap:.6mm}
.disc-kartu header p{font-size:7.2pt;color:#556074;font-weight:600}
.disc-kartu header h3{font-size:10pt}
.disc-kartu header h3 span{color:#2240B0}
.disc-kartu .makna{font-size:7.3pt;line-height:1.42;color:#3A4558}
.disc-pola{display:flex;align-items:center;gap:2mm;background:#EEF2FB;border-radius:2.6mm;padding:1.8mm 2.4mm}
.disc-pola b{font-size:10.5pt;color:#132449;letter-spacing:.02em;min-width:9mm}
.disc-pola span{font-size:7.6pt;font-weight:700;color:#2240B0;line-height:1.2}
.disc-pola span small{display:block;color:#556074;font-weight:500;font-size:6.9pt;margin-top:.4mm}
.disc-svg{width:100%;height:auto;display:block}
.disc-svg .dk-kepala{fill:#132449}
.disc-svg .dk-huruf{fill:#fff;font:700 10px "Plus Jakarta Sans",Arial,sans-serif;text-anchor:middle}
.disc-svg .dk-bingkai{fill:#fff;stroke:#132449;stroke-width:1}
.disc-svg .dk-garis{stroke:#9AA5BA;stroke-width:.7;stroke-dasharray:1.5 2}
.disc-svg .dk-nol{stroke:#132449;stroke-width:1.1}
.disc-svg .dk-kol{stroke:#C9D0DE;stroke-width:.6}
.disc-svg .dk-skala{fill:#556074;font:600 8px "Plus Jakarta Sans",Arial,sans-serif}
.disc-svg .dk-cetak{fill:#A7B0C2;font:500 5.9px "Plus Jakarta Sans",Arial,sans-serif;text-anchor:middle}
.disc-svg .dk-jalur{fill:none;stroke:#2240B0;stroke-width:1.8;stroke-linejoin:round}
.disc-svg .dk-titik{fill:#2240B0;stroke:#fff;stroke-width:1.6}
.disc-svg .dk-nilai{fill:#132449;font:700 7px "Plus Jakarta Sans",Arial,sans-serif;text-anchor:end}
.disc-catatan{margin-top:4mm;font-size:7.4pt;color:#556074;line-height:1.45}
.disc-utama{display:grid;grid-template-columns:44mm 1fr;gap:5mm;background:#132449;color:#fff;border-radius:4.2mm;padding:5mm 5.5mm;margin:1mm 0 4mm}
.disc-utama .kode{display:flex;flex-direction:column;gap:1.4mm;justify-content:center}
.disc-utama .kode small{font-size:7.2pt;color:#AFC0E8;font-weight:600}
.disc-utama .kode b{font:800 26pt "Plus Jakarta Sans",Arial,sans-serif;letter-spacing:.02em;line-height:1}
.disc-utama .kode span{font-size:11pt;font-weight:700}

async function bukaKode(kode) {
  kode = String(kode || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (kode.length < 6) return vMasukKode({ teks: 'Kode tes belum lengkap.', jenis: 'galat' }, kode);
  const btn = $('form[data-form="kode"] button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Memeriksa…'; }
  try {
    const r = await api('bukaToken', { kode, token: '' });
    P = { kode, sesi: r.sesi, state: r.peserta, diterima: Date.now() }; simpanSesiP();
    lanjutPeserta();
  } catch (e) { vMasukKode({ teks: e.message, jenis: 'galat' }, kode); }
}
function lanjutPeserta(pesan) {
  const st = P.state;
  if (!st.biodata) return vBiodata(pesan);
  if (!st.persetujuan) return vPersetujuan(pesan);
  const sisa = st.batch.tes.filter(t => !st.selesai.includes(t));
  if (!sisa.length) return vSelesaiSemua();
  if (st.batch.kamera && !Kamera.aktif()) return vKamera(pesan);
  return vDaftarTes(pesan);
}
async function segarkanP() {
  try { const r = await apiP('statusPeserta'); terimaStateP(r.peserta); return true; }
  catch (e) { if (e.kode === 'SESI_PESERTA' || e.kode === 'TOKEN') { hapusSesiP(); vMasukKode({ teks: e.message, jenis: 'peringatan' }); return false; } throw e; }
}
function errPeserta(e, ulang) {
  if (e.kode === 'SESI_PESERTA' || e.kode === 'TOKEN') { hapusSesiP(); return vMasukKode({ teks: e.message, jenis: 'peringatan' }); }
  ulang({ teks: e.message, jenis: 'galat' });
}

async function simpanBiodata(f) {

  catch (e) { btn.disabled = false; btn.textContent = 'Simpan & lanjut'; if (e.kode === 'SESI_PESERTA' || e.kode === 'TOKEN') errPeserta(e); else pesanForm(f, notis(e.message, 'galat')); }

// Cuplikan pengerjaan terbaik untuk dilanjutkan: dari perangkat ini atau dari autosave server.
function cuplikanLanjut() {
  if (!P || !P.state) return null;
  const st = P.state, now = Date.now(), kandidat = [];
  const pg = bacaLokal('psikotes_progres');
  if (pg && pg.kode === P.kode && !st.selesai.includes(pg.tes) && pg.jenis !== 'latihan') kandidat.push({ sumber: 'lokal', tes: pg.tes, snap: pg, berlaluKini: (+pg.berlalu || 0) + Math.max(0, now - (+pg.tersimpan || now)) });
  if (st.progres && !st.selesai.includes(st.progres.tes)) kandidat.push({ sumber: 'server', tes: st.progres.tes, snap: st.progres.snap, berlaluKini: st.progres.berlaluKini + Math.max(0, now - (P.diterima || now)) });
  if (!kandidat.length) return null;
  kandidat.sort((a, b) => (+b.snap.berlalu || 0) - (+a.snap.berlalu || 0) || (a.sumber === 'lokal' ? -1 : 1));
  return kandidat[0];
}
function bannerLanjutan() {
  if (!P) return '';
  let html = '';
  const td = bacaLokal('psikotes_tertunda');
  if (td && td.kode === P.kode) {
    html += `<div class="notis peringatan banner"><div><b>Hasil tes ${NAMA_TES(td.tes)} belum terkirim.</b> Jawaban Anda aman tersimpan di perangkat ini.</div>
      <button class="tombol utama kecil" data-aksi="kirim-ulang">Kirim sekarang</button></div>`;
  }
  const c = cuplikanLanjut();
  if (c && !(td && td.kode === P.kode && td.tes === c.tes)) {
    const sisa = c.tes === 'ist' ? 60000 : Math.max(0, durasiTesMs(c.tes, P.state.cfg[c.tes]) - c.berlaluKini);
    html += `<div class="notis peringatan banner"><div><b>Tes ${NAMA_TES(c.tes)} sedang berjalan.</b> ${c.tes === 'ist' ? 'Waktu subtes yang sedang dikerjakan tetap berjalan selama Anda terputus.' : sisa > 0 ? `Waktu tes tetap berjalan selama Anda terputus; sisa sekitar ${durasiTeks(sisa / 60000)}.` : 'Waktu tes sudah habis; jawaban yang tersimpan akan langsung dikirim.'}</div>
      <button class="tombol utama kecil" data-aksi="lanjutkan-tes">${sisa > 0 ? 'Lanjutkan tes' : 'Kirim jawaban'}</button></div>`;
  }
  return html;
}

    const c = T.aktif, arr = T.jawaban[c] || (T.jawaban[c] = []);

// Mengembalikan true bila tes diakhiri karena batas peringatan terlampaui.
function catatPelanggaran(jenis, sudahJeda) {
  if (!T || T.berhenti || !T.proktor || (T.jedaSejak && !sudahJeda) || T.melanjutkan) return false;
  // Halaman sedang ditutup/dimuat ulang: tunda dulu. Bila halaman ternyata tetap terbuka, pelanggaran dicatat;
  // bila benar-benar tertutup, peserta masuk kembali dan waktu tetap berjalan (bukan pelanggaran).
  if (T.keluar && Date.now() - T.keluar < 5000) {
    if (!T.tunda) { T.tunda = jenis; const t = T; setTimeout(() => { if (T === t && T.tunda) { const j = T.tunda; T.tunda = null; T.keluar = 0; catatPelanggaran(j); } }, 5000); }
    return false;
  }
  T.pelanggaran.push({ w: new Date().toISOString(), jenis });
  const ke = T.basis + T.pelanggaran.length, batas = T.batasPeringatan;
  const lewat = ke > batas;
  logT('pelanggaran', jenis + (lewat ? ' · melewati batas peringatan' : ` · peringatan ${ke} dari ${batas}`));
  Kamera.foto('Saat pelanggaran: ' + jenis, T.tes);
  perbaruiPeringatan();
  if (lewat) { akhiriTes(`Tes diakhiri karena pelanggaran melebihi batas ${batas} kali peringatan`); return true; }
  if (!T.jedaSejak) T.jedaSejak = Date.now();
  logT('jeda', jenis);
  tampilJeda(); simpanProgres(true); autosaveServer(true);
  return false;
}

  const L = $('#layar-tes'), box = $('#t-jeda'); if (!box || !T) return;
  const terakhir = T.pelanggaran[T.pelanggaran.length - 1], ke = T.basis + T.pelanggaran.length, batas = T.batasPeringatan;
  L.classList.add('dijeda'); $('#t-aba').hidden = true;

    <button class="tombol utama lebar" data-aksi="lanjut-jeda">${T.fsWajib ? 'Kembali ke layar penuh & lanjutkan' : 'Lanjutkan tes'}</button>

// Pindah fase: petunjuk → kerja → petunjuk subtes berikutnya → … ; subtes ME: petunjuk menghafal → hafal → petunjuk2 (cara menjawab + contoh) → kerja.

  const f = T.ist, s = istSub(), now = Math.max(0, berlalu(T, Date.now()));
  if (f.fase === 'petunjuk') { f.fase = s.k === 'me' ? 'hafal' : 'kerja'; f.mulai = now; logT('bagian', `Subtes ${f.i + 1} (${s.kode}) ${f.fase === 'hafal' ? 'mulai menghafal' : 'dimulai'}`); }
  else if (f.fase === 'hafal') { f.fase = 'petunjuk2'; f.mulai = now; logT('bagian', `Subtes ${f.i + 1} (${s.kode}) selesai menghafal, membaca petunjuk soal`); }
  else if (f.fase === 'petunjuk2') { f.fase = 'kerja'; f.mulai = now; logT('bagian', `Subtes ${f.i + 1} (${s.kode}) dimulai`); }
  else {
    const isi = s.soal.filter(q => T.jawaban[q.n] !== undefined && T.jawaban[q.n] !== '').length;
    logT('bagian', `Subtes ${f.i + 1} (${s.kode}) selesai, ${isi} dari ${s.soal.length} soal terisi${ket ? ' · ' + ket : ''}`);
    if (f.i >= T.konten.length - 1) { akhiriTes(); return; }

// Grafik gaya lembar "Personality System Graph Page". tabel = posisi angka tercetak (disimpan bersama hasil).
function svgDISC(g, pos, nilai, tabel) {
  const W = 200, H = 336, kiri = 6, kanan = 22, atas = 26, bawah = 8, lk = (W - kiri - kanan) / 4;
  const y = v => atas + (8 - v) / 16 * (H - atas - bawah), x = i => kiri + lk * (i + 0.5), f1 = v => v.toFixed(1);
  let s = `<svg class="disc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik ${DISC_GRAFIK_INFO[g].no} ${DISC_GRAFIK_INFO[g].kode}: ${DISC_F.map(f => f + ' ' + nilai[f]).join(', ')}">`;
  DISC_F.forEach((f, i) => { s += `<rect x="${f1(kiri + lk * i + 1)}" y="4" width="${f1(lk - 2)}" height="17" rx="3" class="dk-kepala"/><text x="${f1(x(i))}" y="16.5" class="dk-huruf">${f}</text>`; });
  s += `<rect x="${kiri}" y="${atas}" width="${W - kiri - kanan}" height="${H - atas - bawah}" class="dk-bingkai"/>`;
  for (let v = 6; v >= -6; v -= 2) s += `<line x1="${kiri}" x2="${W - kanan}" y1="${f1(y(v))}" y2="${f1(y(v))}" class="${v === 0 ? 'dk-nol' : 'dk-garis'}"/>`;
  for (let v = 8; v >= -8; v -= 2) s += `<text x="${W - kanan + 5}" y="${f1(y(v) + 3)}" class="dk-skala">${v}</text>`;
  for (let i = 1; i < 4; i++) s += `<line x1="${f1(kiri + lk * i)}" x2="${f1(kiri + lk * i)}" y1="${atas}" y2="${H - bawah}" class="dk-kol"/>`;
  if (tabel) DISC_F.forEach((f, i) => (tabel[f] || []).forEach(([v, p]) => { s += `<text x="${f1(x(i) + 9)}" y="${f1(y(p) + 2.2)}" class="dk-cetak">${v}</text>`; }));
  const titik = DISC_F.map((f, i) => [x(i), y(pos[f])]);
  s += `<polyline points="${titik.map(t => f1(t[0]) + ',' + f1(t[1])).join(' ')}" class="dk-jalur"/>`;
  titik.forEach(([tx, ty], i) => { const v = nilai[DISC_F[i]]; s += `<circle cx="${f1(tx)}" cy="${f1(ty)}" r="5" class="dk-titik"/><text x="${f1(tx - 9)}" y="${f1(ty + 3)}" class="dk-nilai">${g === 'change' && v > 0 ? '+' : ''}${v}</text>`; });
  return s + '</svg>';
}

const papiGrupDari = f => PAPI_GRUP.find(g => g.f.includes(f));

// Grafik roda: 20 sektor, angka 0–9 tercetak di tiap sektor, pita kelompok di luar.
function svgPAPI(skor) {
  const cx = 230, cy = 230, r0 = 15, st = 12.7, rr = s => r0 + s * st, R = rr(9.55), RL1 = R + 3, RL2 = R + 55, RG1 = RL2 + 4, RG2 = RL2 + 19;
  const sud = i => (-90 + i * 18) * Math.PI / 180, pt = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)], f2 = n => n.toFixed(2);
  const busur = (r1, r2, a1, a2) => { const [x1, y1] = pt(r2, a1), [x2, y2] = pt(r2, a2), [x3, y3] = pt(r1, a2), [x4, y4] = pt(r1, a1);
    return `M${f2(x1)} ${f2(y1)}A${r2} ${r2} 0 0 1 ${f2(x2)} ${f2(y2)}L${f2(x3)} ${f2(y3)}A${r1} ${r1} 0 0 0 ${f2(x4)} ${f2(y4)}Z`; };
  let o = `<circle cx="${cx}" cy="${cy}" r="${rr(9.5)}" fill="#E7EDFA"/><circle cx="${cx}" cy="${cy}" r="${rr(6.5)}" fill="#F0F4FC"/><circle cx="${cx}" cy="${cy}" r="${rr(3.5)}" fill="#F9FAFD"/>`;
  for (let s = 1; s <= 9; s++) o += `<circle cx="${cx}" cy="${cy}" r="${rr(s)}" fill="none" stroke="#D5DDEC" stroke-width=".45"/>`;
  PAPI_RODA.forEach((f, i) => { o += `<path d="${busur(RL1, RL2, sud(i - .5), sud(i + .5))}" fill="#fff" stroke="#D5DDEC" stroke-width=".6"/>`; });
  PAPI_GRUP.forEach(g => {
    const i1 = PAPI_RODA.indexOf(g.f[0]), i2 = PAPI_RODA.indexOf(g.f[g.f.length - 1]), a1 = sud(i1 - .5) + .012, a2 = sud(i2 + .5) - .012;
    o += `<path d="${busur(RG1, RG2, a1, a2)}" fill="${g.warna}"/>`;
    const rt = (RG1 + RG2) / 2, bawah = Math.sin((((i1 + i2) / 2) * 18 - 90) * Math.PI / 180) > .05;
    const [x1, y1] = pt(rt, bawah ? a2 : a1), [x2, y2] = pt(rt, bawah ? a1 : a2);
    o += `<path id="papi-gp-${g.id}" d="M${f2(x1)} ${f2(y1)}A${rt} ${rt} 0 0 ${bawah ? 0 : 1} ${f2(x2)} ${f2(y2)}" fill="none"/>`;
    o += `<text class="pp-grup" dy="2.6"><textPath href="#papi-gp-${g.id}" startOffset="50%" text-anchor="middle">${g.nama}</textPath></text>`;
  });
  PAPI_RODA.forEach((f, i) => { const a = sud(i - .5), [x1, y1] = pt(r0, a), [x2, y2] = pt(RL2, a); o += `<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" stroke="#C9D2E3" stroke-width=".6"/>`; });
  PAPI_RODA.forEach((f, i) => { for (let s = 1; s <= 9; s++) { const [x, y] = pt(rr(s), sud(i)); o += `<text class="pp-angka" x="${f2(x)}" y="${f2(y)}">${s}</text>`; } });
  o += `<circle cx="${cx}" cy="${cy}" r="${r0 - 3}" fill="#fff" stroke="#C9D2E3" stroke-width=".6"/><text class="pp-angka" x="${cx}" y="${cy}">0</text>`;
  // Label faktor ditulis mengikuti lingkaran dan diletakkan di tengah kolomnya; separuh bawah diputar balik agar tidak terbaca terbalik.
  const pecah = t => { const k = t.split(' '); if (k.length < 2) return [t]; let best = null;
    for (let j = 1; j < k.length; j++) { const l = [k.slice(0, j).join(' '), k.slice(j).join(' ')], m = Math.max(l[0].length, l[1].length); if (!best || m < best[0]) best = [m, l]; }
    return best[1]; };
  const rc = (RL1 + RL2) / 2;
  PAPI_RODA.forEach((f, i) => {
    const g = papiGrupDari(f), deg = -90 + i * 18, a = sud(i), atas = Math.sin(a) <= 1e-6, rot = atas ? deg + 90 : deg - 90, arah = atas ? -1 : 1;
    const [x, y] = pt(rc, a), baris = pecah(PAPI_FAKTOR[f].nama), yNama = arah * 11;
    const nama = baris.length === 2 ? `<tspan x="0" y="${yNama - 3.5}">${esc(baris[0])}</tspan><tspan x="0" y="${yNama + 3.5}">${esc(baris[1])}</tspan>` : `<tspan x="0" y="${yNama}">${esc(baris[0])}</tspan>`;
    o += `<g transform="translate(${f2(x)} ${f2(y)}) rotate(${rot})"><text class="pp-huruf" x="0" y="${-arah * 13.5}" fill="${g.warna}">${f}</text><text class="pp-label" text-anchor="middle">${nama}</text></g>`;
  });
  const titik = PAPI_RODA.map((f, i) => pt(rr(+skor[f] || 0), sud(i)));
  o += `<polygon points="${titik.map(p => p.map(f2).join(',')).join(' ')}" fill="rgba(34,64,176,.13)" stroke="#2240B0" stroke-width="1.7" stroke-linejoin="round"/>`;
  PAPI_RODA.forEach((f, i) => { const [x, y] = titik[i]; o += `<circle cx="${f2(x)}" cy="${f2(y)}" r="5.4" fill="#2240B0" stroke="#fff" stroke-width="1.3"/><text class="pp-nilai" x="${f2(x)}" y="${f2(y)}">${+skor[f] || 0}</text>`; });
  return `<svg class="papi-roda" viewBox="0 0 460 460" role="img" aria-label="Grafik PAPI Kostick">${o}</svg>`;
}

      <div class="pg-kartu pg-sorot"><p class="pg-judul">Paling menonjol</p><p class="pg-teks">${tinggi.length ? daftarF(tinggi) : 'Tidak ada faktor dengan skor 7 ke atas.'}</p>

/* ---------- Kunci otomatis bila tidak ada aktivitas ---------- */
const KUNCI_AKTIF = 'potrev_aktif';
let simpanAktifTerakhir = 0;
const menitKunci = () => { const m = S.pengaturan ? +S.pengaturan.kunciMenit : NaN; return isNaN(m) ? 2 : Math.max(0, m); };
function catatAktif(paksa) {
  if (!S.stafToken) return;
  const kini = Date.now(); S.aktifTerakhir = kini;
  if (paksa || kini - simpanAktifTerakhir > 4000) { simpanAktifTerakhir = kini; simpanLokal(KUNCI_AKTIF, { t: kini, m: menitKunci() }); }
  const w = $('#kunci-peringatan'); if (w) w.remove();
}
// Aktivitas di tab lain (browser yang sama) juga dihitung.
function aktifTerakhir() { const l = bacaLokal(KUNCI_AKTIF); return Math.max(S.aktifTerakhir || 0, (l && l.t) || 0); }
// Dipanggil saat halaman dibuka: sesi lama yang sudah melewati batas tidak dibuka otomatis.
function sesiKedaluwarsa() { const l = bacaLokal(KUNCI_AKTIF); return !!(l && l.m > 0 && Date.now() - l.t > l.m * 60000); }
function cekIdle() {
  if (!S.stafToken || !S.user) return;
  const m = menitKunci(); if (!m) return;
  const sisa = aktifTerakhir() + m * 60000 - Date.now();
  if (sisa <= 0) return kunciSesi(m);
  if (sisa <= 20000) {
    let w = $('#kunci-peringatan');
    if (!w) { w = document.createElement('div'); w.id = 'kunci-peringatan'; w.setAttribute('role', 'status'); document.body.appendChild(w); }
    w.textContent = `Tidak ada aktivitas. Sesi terkunci dalam ${Math.ceil(sisa / 1000)} detik. Gerakkan mouse atau tekan tombol apa saja untuk tetap masuk.`;
  }
}
async function kunciSesi(m) {
  const u = S.user && S.user.username;
  S.kembali = { u, tab: S.tab, klienAktif: S.klienAktif };
  try { await api('logout'); } catch (e) { /* tetap dikunci */ }
  const d = document.getElementById('dlg-contoh'); if (d) d.remove();
  const w = $('#kunci-peringatan'); if (w) w.remove();
  simpanLokal(KUNCI_AKTIF, null);
  keluarStafLokal({ teks: `Sesi terkunci karena tidak ada aktivitas selama ${m} menit. Silakan masuk lagi.`, jenis: 'peringatan' });
  const f = $('#f-user'); if (f && u) { f.value = u; const pw = $('#f-pass'); if (pw) pw.focus(); }
}
setInterval(cekIdle, 1000);
['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(ev => window.addEventListener(ev, () => { if (S.user) catatAktif(); }, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) cekIdle(); });

function bacaGambar(file, maksW, maksH, cb) {
  if (!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const sk = Math.min(1, maksW / img.width, maksH / img.height), c = document.createElement('canvas');
    c.width = Math.round(img.width * sk); c.height = Math.round(img.height * sk);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let data = c.toDataURL('image/png');
    if (data.length > 44000) { const x = c.getContext('2d'); x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); data = c.toDataURL('image/jpeg', 0.82); }
    URL.revokeObjectURL(url); cb(data);
  };
  img.src = url;
}

// Isian modul langsung memperbarui S.mEdit.
function aturNilaiModul(el, padaChange) {
  const m = S.mEdit, d = el.dataset; if (!m || !S.mBoleh) return;
  const v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value;
  if (d.mf) {
    m[d.mf] = v;
    if (d.mf === 'nama') { const h = $('#judul-modul'); if (h) h.textContent = v || 'Modul baru'; }
    return;
  }
  if (d.af) {
    const [i, f] = d.af.split(':'), a = m.aspek[+i]; if (!a) return;
    if (f === 'sumber') { if (!padaChange) return; const st = new Set(a.sumber); if (el.checked) st.add(el.value); else st.delete(el.value); a.sumber = Array.from(st); }
    else if (/^n\d$/.test(f)) a.nilai[+f[1]] = +el.value;
    else a[f] = v;
    if (padaChange && ['ranah', 'kunci', 'sumber'].includes(f)) gambarUlangModul();
    return;
  }
  if (d.kf) { const [i, f] = d.kf.split(':'), k = m.rekKategori[+i]; if (k) k[f] = el.value; }
}
function pindahLangkahModul(n) {

async function simpanModul(f, status) {

function rentang(n) {
  const b = normaBatas(n).map(v => fmt(v, 2));
  if (n.arah === 'turun') return [`> ${b[3]}`, `${b[2]} < x ≤ ${b[3]}`, `${b[1]} < x ≤ ${b[2]}`, `${b[0]} < x ≤ ${b[1]}`, `≤ ${b[0]}`];
  return [`< ${b[0]}`, `${b[0]} – < ${b[1]}`, `${b[1]} – < ${b[2]}`, `${b[2]} – < ${b[3]}`, `≥ ${b[3]}`];
}

// Setelah laporan tampil: Ringkasan dipadatkan bertahap agar tetap satu halaman (kesimpulan dan tanda tangan ikut di dalamnya);
// baris psikogram yang tidak muat dipindah ke halaman lanjutan. Nomor halaman disesuaikan.
async function rapikanLaporan() {
  const lap = $('#lap'); if (!lap) return;
  const giliran = lap._giliran = (lap._giliran || 0) + 1;
  try { await document.fonts.ready; } catch (e) {}
  if (lap._giliran !== giliran || !lap.isConnected || !lap.offsetWidth) return;
  const luber = h => { const x = h.querySelector('.hal-isi'); return !!x && x.scrollHeight - x.clientHeight > 1; };
  const lanjutan = (asal, judul) => {
    const h = asal.cloneNode(true); h.classList.remove('hal-ringkas', 'rapat', 'rapat2');
    const sek = h.querySelector('.sek'), lead = sek && sek.querySelector('.sek-lead');
    if (lead) lead.remove();
    if (sek) sek.querySelector('h2').textContent = judul + ' (lanjutan)';
    return h;
  };
  // 1. Ringkasan
  // Tahap: lapang → biasa → rapat (baris profil) → rapat2 (daftar Kekuatan/Sesuai disembunyikan) → rapat3 (hanya jumlah).
  const pas = h => {
    const tahap = ['rapat', 'rapat2', 'rapat3'];
    h.classList.remove('longgar', ...tahap);
    h.classList.add('longgar'); if (!luber(h)) return true;
    h.classList.remove('longgar');
    for (const k of tahap) { if (!luber(h)) return true; h.classList.add(k); }
    return !luber(h);
  };
  const r = lap.querySelector('.hal-ringkas');
  if (r && !pas(r)) {
    // Kesimpulan sangat panjang: kesimpulan dan tanda tangan pindah ke halaman berikutnya.
    const akhir = r.querySelector('.akhir'), h = lanjutan(r, 'Ringkasan Hasil Psikotes'), isi = h.querySelector('.hal-isi');
    [...isi.children].forEach(x => { if (!x.classList.contains('sek')) x.remove(); });
    isi.appendChild(akhir); h.classList.add('hal-ringkas-lanjut'); r.after(h); pas(r);
  }
  // 2. Psikogram
  const pertama = lap.querySelector('.hal .psg');
  let hal = pertama && pertama.closest('.hal'), jaga = 0;
  while (hal && jaga++ < 20) {
    const tb = hal.querySelector('.psg tbody'), bawa = []; let ringkas = null;
    while (luber(hal)) {
      const rk = hal.querySelector('.psg-ringkas');
      if (rk && !ringkas) { ringkas = rk; rk.remove(); continue; }
      if (tb.rows.length <= 1) break;
      bawa.unshift(tb.rows[tb.rows.length - 1]); tb.rows[tb.rows.length - 1].remove();
    }
    while (bawa.length && tb.rows.length > 1 && tb.rows[tb.rows.length - 1].classList.contains('psg-ranah')) { bawa.unshift(tb.rows[tb.rows.length - 1]); tb.rows[tb.rows.length - 1].remove(); }
    let berikut = hal.nextElementSibling;
    if (bawa.length || ringkas) {
      if (!berikut || !berikut.querySelector('.psg')) {
        berikut = lanjutan(hal, 'Psikogram Hasil Pemeriksaan');
        berikut.querySelector('.psg tbody').innerHTML = '';
        const rk = berikut.querySelector('.psg-ringkas'); if (rk) rk.remove();
        hal.after(berikut);
      }
      const ntb = berikut.querySelector('.psg tbody');
      for (let i = bawa.length - 1; i >= 0; i--) ntb.insertBefore(bawa[i], ntb.firstChild);
      if (ringkas && !berikut.querySelector('.psg-ringkas')) berikut.querySelector('.psg').after(ringkas);
    }
    hal = berikut && berikut.querySelector('.psg') ? berikut : null;
  }
  // 3. Halaman lain yang isinya tidak muat (mis. Interpretasi DISC dengan empat pergeseran, Panduan dengan banyak alat tes):
  //    blok terakhir pindah ke halaman lanjutan, bukan terpotong. Judul kecil ikut pindah bersama isinya.
  const judulKecil = x => /^H[34]$/.test(x.tagName) || x.classList.contains('sub-judul');
  [...lap.querySelectorAll('.hal')].forEach(h => {
    if (h.classList.contains('sampul') || h.classList.contains('hal-ringkas') || h.querySelector('.psg')) return;
    const judul = ((h.querySelector('.sek h2') || {}).textContent || '').replace(/ \(lanjutan\)$/, '');
    let kini = h;
    while (kini && luber(kini)) {
      const isi = kini.querySelector('.hal-isi'), blok = [...isi.children].filter(x => !x.classList.contains('sek')), bawa = [];
      while (luber(kini) && blok.length > 1) { const x = blok.pop(); bawa.unshift(x); x.remove(); }
      while (blok.length > 1 && judulKecil(blok[blok.length - 1])) { const x = blok.pop(); bawa.unshift(x); x.remove(); }
      if (!bawa.length) break;
      const baru = lanjutan(kini, judul), bi = baru.querySelector('.hal-isi');
      baru.classList.remove('hal-alir');
      [...bi.children].forEach(x => { if (!x.classList.contains('sek')) x.remove(); });
      bawa.forEach(x => bi.appendChild(x)); kini.after(baru); kini = baru;
    }
  });
  // 4. Nomor halaman
  const semua = [...lap.querySelectorAll('.hal')], dua = n => String(n).padStart(2, '0');
  semua.forEach((h, i) => { const n = h.querySelector('.hf-no'); if (n) n.textContent = `${dua(i + 1)} / ${dua(semua.length)}`; });
}
function skalakanLaporan() {
  const w = $('#lap'); if (!w) return;
  w.style.setProperty('--skala', Math.min(1, (w.clientWidth - 16) / 794).toFixed(3));
}
window.addEventListener('resize', () => { if ($('#lap')) skalakanLaporan(); });
async function muatFotoLaporan(L) {
  const kode = L.token.kode, cache = fotoCache[kode] = fotoCache[kode] || {};
  const perlu = L.foto.map(f => f.id).filter(id => !cache[id]);
  const st = $('#status-foto-lap');
  const pasang = () => document.querySelectorAll('img[data-foto]').forEach(img => { const d = cache[img.dataset.foto]; if (d && !img.src) img.src = d; if (d === '') { const fg = img.closest('figure'); if (fg) fg.classList.add('hilang'); else img.hidden = true; } });
  pasang();
  for (let i = 0; i < perlu.length; i += 30) {
    if (st) st.textContent = `Memuat foto ${Math.min(i + 30, perlu.length)} dari ${perlu.length}…`;
    try {
      const r = await panggil('fotoPeserta', { kode, ids: perlu.slice(i, i + 30) });
      r.foto.forEach(f => { cache[f.id] = f.data ? 'data:image/jpeg;base64,' + f.data : ''; });
    } catch (e) { if (st) st.textContent = 'Sebagian foto gagal dimuat.'; return; }
    if (!S.laporan || S.laporan.token.kode !== kode) return;
    pasang();
  }
  if (st) st.textContent = L.foto.length ? `${L.foto.length} foto dimuat.` : '';
}

/* ---------- Panel review (tidak ikut dicetak) ---------- */
function catatanPelaksanaan(L) {
  const c = [];
  L.hasil.forEach(h => {
    const n = (h.pelanggaran || []).length, nm = 'Tes ' + NAMA_TES(h.tes);
    if (h.dihentikan) c.push(`${nm}: ${h.dihentikan}.`);
    if (n) c.push(`${nm}: ${n} pelanggaran tercatat (${h.pelanggaran.map(p => p.jenis.toLowerCase()).join('; ')}), total jeda ${durasiDetik(h.jedaDetik)}.`);
    if (h.flag && !h.dihentikan) c.push(`${nm}: ${h.flag}.`);
    else if (h.flag && h.flag.indexOf('Kecepatan') >= 0) c.push(`${nm}: ${h.flag.split(';')[0]}.`);
    if (h.mode === 'Uji coba') c.push(`${nm}: durasi singkat (uji coba); ${h.tes === 'kraepelin' || h.tes === 'pauli' ? 'skor disetarakan ke durasi penuh dan ' : ''}tidak untuk penilaian.`);
  });
  const belum = L.batch.tes.filter(t => !L.hasil.some(h => h.tes === t));
  if (belum.length) c.push('Tes belum dikerjakan: ' + belum.map(NAMA_TES).join(', ') + '.');
  return c;
}
// Ringkasan dasar rekomendasi menurut tipe di modul.

function potong(arr, n) { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out.length ? out : [[]]; }
function perangkatRingkas(ua) {

  'biodata': f => simpanBiodata(f),
  'login-staf': f => masukStaf(f.elements.username.value.trim().toLowerCase(), f.elements.password.value),
  'klien': f => simpanKlien(f),
  'isi-token': f => isiToken(f),
  'modul': (f, tombol) => simpanModul(f, tombol && tombol.dataset.status),
  'batch': f => simpanBatch(f),
  'tambah-token': f => tambahTokenForm(f),
  'tambah-akun': f => tambahAkun(f),
  'pengaturan': f => simpanPengaturan(f),
  'profil': f => simpanProfil(f),
  'ganti-password': f => gantiPassword(f),
  'review': f => simpanReview(f),
  'password-baru': f => simpanPasswordBaru(f)
};
function perbaruiPilihKode() {
  const n = document.querySelectorAll('.pilih-kode:checked').length, b = $('#hapus-terpilih');
  if (b) { b.disabled = !n; b.dataset.yakin = ''; b.classList.remove('bahaya'); b.textContent = n ? `Hapus ${n} kode terpilih` : 'Hapus kode terpilih'; }
}
const UBAH = {
  'setuju': el => { const b = $('#tombol-setuju'); if (b) b.disabled = !el.checked; },
  'filter-batch': el => { S.filter.batch = el.value; gambarDaftarPeserta(); },
  'filter-modul': el => { S.filterModul = el.value; gambarDaftarKode(); },
  'modul-batch': el => gantiModulBatch(el),
  'klien-aktif': el => { S.klienAktif = el.value; S.filter.batch = ''; if ($('form[data-form="batch"]') || !$('#isi-tab')) vBuatBatch(); else vStaf(); },
  'metode-klien': el => { const tok = el.value === 'token'; $('#isi-token').hidden = !tok; $('#isi-langganan').hidden = tok; },
  'logo': el => bacaGambar(el.files && el.files[0], 420, 160, data => { S.logoBaru = data; $('#logo-pratinjau').innerHTML = `<img src="${data}" alt="Logo baru">`; }),
  'tes-modul': el => ubahModul(m => {
    const t = el.value;
    if (el.checked && !m.tes.includes(t)) { m.tes.push(t); tambahAspekTes(m.aspek, t, m.skala); }
    if (!el.checked) { m.tes = m.tes.filter(x => x !== t); m.aspek = buangAspekTes(m.aspek, t); }
  }),
  'skala-modul': el => ubahModul(m => { const ke = +el.value; m.aspek = ubahSkalaAspek(m.aspek, m.skala, ke); m.rekKategori = ubahSkalaKategori(m.rekKategori, m.rekTipe, m.skala, ke); m.skala = ke; }),
  'rek-tipe': el => ubahModul(m => {
    const lama = m.rekKategori, baru = kategoriAwal(el.value, m.skala);
    if (lama.length === baru.length) baru.forEach((k, i) => { k.nama = lama[i].nama || k.nama; k.ket = lama[i].ket; });
    m.rekTipe = el.value; m.rekKategori = baru;
  }),
  'pilih-semua': el => { document.querySelectorAll('.pilih-kode').forEach(x => { x.checked = el.checked; }); perbaruiPilihKode(); },
  'pilih-kode': () => perbaruiPilihKode(),
  'pilih-peserta': () => perbaruiPilihPeserta(),
  'pilih-semua-peserta': el => { document.querySelectorAll('.pilih-peserta').forEach(x => { x.checked = el.checked; }); perbaruiPilihPeserta(); },
  'peran-akun': el => { $('#akun-klien').hidden = el.value === 'superadmin'; $('#akun-psikolog').hidden = el.value !== 'superadmin'; },
  'ttd': el => bacaTtd(el.files && el.files[0])
};
document.addEventListener('click', e => {
  const k = e.target.closest('#layar-tes [data-k]');
  if (k) { if (e.detail === 0) tekanTombol(k); return; } // klik dari keyboard; sentuhan/mouse ditangani pointerdown
  const el = e.target.closest('[data-aksi]'); if (!el) return;
  const f = AKSI[el.dataset.aksi]; if (!f) return;
  e.preventDefault(); f(el, e);
});
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#layar-tes [data-k]'); if (!b) return;
  e.preventDefault(); tekanTombol(b);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const h = FORM[f.dataset.form]; if (h) h(f, e.submitter);
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.input === 'cari') { S.filter.cari = e.target.value; gambarDaftarPeserta(); }
  if (e.target.dataset && e.target.dataset.input === 'foto-kb') { const b = $('#perkiraan-foto'); if (b) b.innerHTML = perkiraanFoto(e.target.value, S.pengaturan); }
  if (e.target.dataset && e.target.dataset.input === 'biaya') { const b = $('#biaya'); if (b) b.innerHTML = teksBiaya(S.klienBatch, Math.max(0, Math.floor(+e.target.value || 0))); }
  if (e.target.matches && e.target.matches('[data-mf],[data-af],[data-kf]')) aturNilaiModul(e.target, false);
  if (e.target.dataset && e.target.dataset.istN) istKetik(e.target);
  if (e.target.id === 'f-kode') { const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v !== e.target.value) e.target.value = v; }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-ubah]'); if (el && UBAH[el.dataset.ubah]) return UBAH[el.dataset.ubah](el);
  if (e.target.matches && e.target.matches('[data-mf],[data-af],[data-kf]')) aturNilaiModul(e.target, true);
});
document.addEventListener('keydown', e => {
  if (!T || T.berhenti || $('#layar-tes').hidden || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (T.tes === 'ist') return istTombol(e);
  if (T.tes === 'disc') return discTombol(e);
  if (T.tes === 'papi') return papiTombol(e);
  if (T.jedaSejak) return;
  let k = null;
  if (/^[0-9]$/.test(e.key)) k = e.key; else if (e.key === 'Backspace' || e.key === 'Delete') k = 'koreksi';
  if (k === null) return;
  e.preventDefault();
  const b = $(`#layar-tes [data-k="${k}"]`); if (b) tekanTombol(b); else tekan(k);
});
document.addEventListener('contextmenu', e => { if (e.target.closest('#layar-tes')) e.preventDefault(); });
// Selama tes: teks soal tidak bisa disalin, dipotong, atau ditempel. Percobaannya dicatat di log pengawasan
// (bukan pelanggaran; tes tidak dijeda). Catatan dibatasi sekali per 5 detik per jenis agar log tidak penuh.
const layarTesAktif = () => { const L = $('#layar-tes'); return !!L && !L.hidden; };
const catatSalin = (jenis, ket) => {
  if (!T || T.berhenti) return;
  const kini = Date.now(); T.cegahTerakhir = T.cegahTerakhir || {};
  if (kini - (T.cegahTerakhir[jenis] || 0) < 5000) return;
  T.cegahTerakhir[jenis] = kini; logT(jenis, ket); simpanProgres();
};
['copy', 'cut'].forEach(ev => document.addEventListener(ev, e => {
  if (!layarTesAktif()) return;
  e.preventDefault();
  try { e.clipboardData.setData('text/plain', 'Soal PotRev tidak boleh disalin.'); } catch (x) { /* abaikan */ }
  catatSalin('salin', ev === 'cut' ? 'Memotong teks diblok' : 'Menyalin teks diblok');
}, true));
document.addEventListener('paste', e => { if (!layarTesAktif()) return; e.preventDefault(); catatSalin('tempel', 'Menempel teks diblok'); }, true);
document.addEventListener('keydown', e => {
  if (!layarTesAktif() || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'c' || k === 'x' || k === 'insert') { e.preventDefault(); catatSalin('salin', (k === 'x' ? 'Ctrl+X' : 'Ctrl+C') + ' diblok'); }
  else if (k === 'v') { e.preventDefault(); catatSalin('tempel', 'Ctrl+V diblok'); }
  else if (k === 'a' && !/^(INPUT|TEXTAREA)$/.test((e.target || {}).tagName)) e.preventDefault();
}, true);
document.addEventListener('selectstart', e => { if (layarTesAktif() && !(e.target.closest && e.target.closest('input, textarea'))) e.preventDefault(); }, true);
document.addEventListener('dragstart', e => { if (layarTesAktif()) e.preventDefault(); }, true);
window.addEventListener('online', () => AntreFoto.kirim());

/* ================= Mulai ================= */
function vGagalMuat(e) {
  render(kepala() + `<main class="wrap sempit"><div class="tumpuk"><h1>Tidak bisa terhubung</h1>${notis(e.message, 'galat')}
    <div class="aksi"><button class="tombol utama" data-aksi="muat-ulang-halaman">Coba lagi</button></div></div></main>`);
}
(async function init() {
  const qs = new URLSearchParams(location.search), kodeUrl = (qs.get('token') || qs.get('kode') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const kestaf = qs.has('staf') || qs.has('admin');
  if (kodeUrl || kestaf) history.replaceState(null, '', location.pathname);
  if (DEMO) await siapkanDemo();
  const tok = bacaLokal(KUNCI_STAF);
  if (tok && !kodeUrl) {
    S.stafToken = tok;
    if (sesiKedaluwarsa()) {
      const m = bacaLokal(KUNCI_AKTIF).m;
      try { await api('logout'); } catch (e) { /* abaikan */ }
      keluarStafLokal({ teks: `Sesi terkunci karena tidak ada aktivitas selama ${m} menit. Silakan masuk lagi.`, jenis: 'peringatan' });
      return;
    }
    try { const r = await api('sesi'); terimaSesiStaf(r); return vStaf(); }
    catch (e) { if (e.kode === 'JARINGAN') return vGagalMuat(e); S.stafToken = null; simpanLokal(KUNCI_STAF, null); }
  }
  const sp = bacaLokal(KUNCI_P);
  if (sp && sp.kode && !kestaf && (!kodeUrl || kodeUrl === sp.kode)) {
    P = { kode: sp.kode, sesi: sp.sesi, state: sp.state };
    try { const r = await apiP('statusPeserta'); terimaStateP(r.peserta); AntreFoto.kirim(); return lanjutPeserta(); }
    catch (e) {
      if (e.kode === 'JARINGAN' && P.state) { AntreFoto.kirim(); return lanjutPeserta({ teks: 'Tidak bisa terhubung ke server. Anda tetap bisa melanjutkan; jawaban dikirim begitu koneksi kembali.', jenis: 'peringatan' }); }
      hapusSesiP();
      if (!kodeUrl) return vMasukKode({ teks: e.message, jenis: 'peringatan' });
    }
  }
  AntreFoto.kirim();
  if (kodeUrl) return bukaKode(kodeUrl);
  if (kestaf) return vLoginStaf();
  vMasukKode();
})();

</script>
</body>
