<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Psikotes Kraepelin &amp; Pauli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Public+Sans:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600;700&display=swap">
<style>
/* Tata letak: lembar kerja psikotes — satu kolom formulir 980px; layar tes memenuhi layar dengan papan angka di bawah */
:root{
  --kertas:#F3F5F8; --lembar:#FFFFFF; --tinta:#172030; --pudar:#5B6578; --garis:#D3D9E3; --garis-tipis:#E8ECF2;
  --biru:#2240B0; --di-biru:#FFFFFF; --biru-lembut:#E8EDFB;
  --merah:#BC371F; --merah-lembut:#FBE8E3; --kuning:#8A5E08; --kuning-lembut:#FAF0D6; --hijau:#1B7046; --hijau-lembut:#E0F1E7;
  --font-judul:"Archivo","Arial Narrow",Arial,system-ui,sans-serif;
  --font-isi:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-angka:"Red Hat Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --kertas:#0D121A; --lembar:#151C27; --tinta:#E4E9F2; --pudar:#98A2B4; --garis:#2A3443; --garis-tipis:#1E2632;
    --biru:#93A6FF; --di-biru:#0D121A; --biru-lembut:#1C2647;
    --merah:#FF8D72; --merah-lembut:#3A1D17; --kuning:#EDC062; --kuning-lembut:#332810; --hijau:#64D39C; --hijau-lembut:#14301F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --kertas:#0D121A; --lembar:#151C27; --tinta:#E4E9F2; --pudar:#98A2B4; --garis:#2A3443; --garis-tipis:#1E2632;
  --biru:#93A6FF; --di-biru:#0D121A; --biru-lembut:#1C2647;
  --merah:#FF8D72; --merah-lembut:#3A1D17; --kuning:#EDC062; --kuning-lembut:#332810; --hijau:#64D39C; --hijau-lembut:#14301F;
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.tes-aktif,html.tes-aktif body{overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--kertas);color:var(--tinta);font:400 15px/1.55 var(--font-isi);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-judul);font-stretch:110%;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(26px,5.2vw,34px);font-weight:780}
h2{font-size:19px;font-weight:720}
h3{font-size:15px;font-weight:700}
p{margin:0}
b{font-weight:650}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:600 11.5px/1.2 var(--font-angka);letter-spacing:.12em;text-transform:uppercase;color:var(--pudar)}
.lead{color:var(--pudar);max-width:62ch}
.mono{font-family:var(--font-angka);font-variant-numeric:tabular-nums}
.catatan-kecil{font-size:12.5px;color:var(--pudar);line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:flex;flex-direction:column;gap:22px}
.wrap.sempit{max-width:640px}
.tumpuk{display:flex;flex-direction:column;gap:10px}

/* Kepala */
.pita{background:var(--lembar);border-bottom:1px solid var(--garis)}
.kepala{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;min-height:56px}
.merek{display:flex;align-items:center;gap:10px;font:760 16px/1 var(--font-judul);font-stretch:118%;min-width:0}
.merek svg{flex:none}
.kepala-aksi{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.siapa{font-size:13.5px;color:var(--pudar);margin-right:6px}

/* Tombol & isian */
.tombol{font:600 14.5px/1.1 var(--font-isi);border-radius:8px;padding:10px 16px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--tinta);background:none;min-height:44px;text-align:center}
.tombol.utama{background:var(--biru);color:var(--di-biru)}
.tombol.utama:hover{filter:brightness(1.08)}
.tombol.sekunder{background:var(--lembar);border-color:var(--garis)}
.tombol.sekunder:hover{border-color:var(--pudar)}
.tombol.teks{padding:8px 10px;min-height:38px;color:var(--pudar)}
.tombol.teks:hover{color:var(--tinta)}
.tombol.kecil{min-height:34px;padding:7px 12px;font-size:13.5px}
.tombol.lebar{width:100%}
.tombol:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:2px solid var(--biru);outline-offset:2px}
.aksi{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.isian{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--pudar)}
.isian small{font-weight:400;font-size:12px}
.isian input,.isian select,.isian textarea,.cari input{font:400 15px/1.4 var(--font-isi);color:var(--tinta);background:var(--lembar);border:1px solid var(--garis);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.isian textarea{min-height:120px;resize:vertical}
.isian input:focus,.isian select:focus,.isian textarea:focus,.cari input:focus{outline:2px solid var(--biru);outline-offset:-1px;border-color:transparent}
.gabung{display:flex;gap:8px}
.gabung input{flex:1;min-width:0}
form{display:flex;flex-direction:column;gap:14px}
.saklar{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--garis);border-radius:10px;cursor:pointer;max-width:620px}
.saklar input{width:18px;height:18px;margin-top:2px;accent-color:var(--biru);flex:none}
.saklar span{display:flex;flex-direction:column;gap:2px}
.saklar small{color:var(--pudar);font-size:13px}

/* Panel & notis */
.lembar{background:var(--lembar);border:1px solid var(--garis);border-radius:12px;padding:20px}
.notis{padding:11px 14px;border-radius:8px;background:var(--biru-lembut);font-size:14px;line-height:1.5}
.notis.galat{background:var(--merah-lembut)}
.notis.ok{background:var(--hijau-lembut)}
.notis.peringatan{background:var(--kuning-lembut)}
.banner{display:flex;gap:12px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner > div{flex:1 1 240px;min-width:0}
.salin-kotak{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.salin-kotak code{font:500 14px var(--font-angka);background:var(--lembar);border:1px solid var(--garis);border-radius:6px;padding:6px 10px;user-select:all;overflow-wrap:anywhere}
.memuat{color:var(--pudar);font-size:14px}

/* Chip */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--font-isi);padding:5px 9px;border-radius:999px;background:var(--garis-tipis);color:var(--pudar);white-space:nowrap}
.chip.l0{background:var(--merah-lembut);color:var(--merah)}
.chip.l1{background:var(--kuning-lembut);color:var(--kuning)}
.chip.l2{background:var(--garis-tipis);color:var(--tinta)}
.chip.l3{background:var(--hijau-lembut);color:var(--hijau)}
.chip.l4{background:var(--hijau);color:var(--lembar)}
.chip.draf{background:var(--kuning-lembut);color:var(--kuning)}
.chip.ok{background:var(--hijau-lembut);color:var(--hijau)}
.chip.biru{background:var(--biru-lembut);color:var(--biru)}

/* Masuk */
.masuk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:start;padding-block:48px 64px}
.masuk-intro{display:flex;flex-direction:column;gap:14px}
.masuk-intro h1{font-size:clamp(34px,7vw,52px);font-stretch:118%;line-height:1.02}
.masuk-form{display:flex;flex-direction:column;gap:16px}
.akun-demo{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.akun-demo .tombol{justify-content:space-between}
.akun-demo .tombol span{font:500 12.5px var(--font-angka);color:var(--pudar)}
.potongan{display:flex;border:1px solid var(--garis);border-radius:10px;background:var(--lembar);width:fit-content;max-width:100%;overflow:hidden;margin-top:10px}
.pot-lajur{display:flex;flex-direction:column;padding:12px 16px 12px 14px;border-right:1px solid var(--garis-tipis)}
.pot-lajur:last-child{border-right:0}
.pa{font:500 19px/22px var(--font-angka);color:var(--tinta)}
.pj{font:600 13px/12px var(--font-angka);color:var(--biru);padding-left:18px;height:12px}
@media (max-width:760px){
  .masuk{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:20px 48px}
}

/* Kartu tes */
.kartu-tes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.kartu{display:flex;flex-direction:column;gap:14px}
.kartu-kepala{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kartu .desk{color:var(--pudar);font-size:14px}
.kartu .tombol{margin-top:auto;align-self:flex-start}
.fakta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0;border:1px solid var(--garis-tipis);border-radius:8px}
.fakta div{padding:9px 10px;border-left:1px solid var(--garis-tipis);min-width:0}
.fakta div:first-child{border-left:0}
.fakta dt{font-size:11.5px;color:var(--pudar)}
.fakta dd{margin:2px 0 0;font:600 15px var(--font-angka);font-variant-numeric:tabular-nums}

/* Instruksi */
.instruksi{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:20px;align-items:start}
@media (max-width:760px){.instruksi{grid-template-columns:minmax(0,1fr)}}
.langkah{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:l}
.langkah li{counter-increment:l;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:baseline;max-width:62ch}
.langkah li::before{content:counter(l);font:600 13px var(--font-angka);color:var(--biru);border:1.5px solid var(--biru);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.contoh{display:flex;flex-direction:column;align-items:center;gap:10px}
.contoh .catatan-kecil{text-align:center}
.siap{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--pudar)}
.konfirmasi{border-color:var(--biru);display:flex;flex-direction:column;gap:12px}
.setuju{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.setuju input{width:18px;height:18px;margin-top:2px;accent-color:var(--biru);flex:none}

/* Strip angka (dipakai di layar tes & contoh) */
.strip{display:flex;flex-direction:column;width:156px;--h-angka:42px;--h-slot:28px}
.strip.mini{--h-angka:34px;--h-slot:22px;width:128px}
.r{display:grid;grid-template-columns:52% 48%;align-items:center}
.r.angka{height:var(--h-angka)}
.r.angka .d{text-align:center;font:500 calc(var(--h-angka)*.8)/1 var(--font-angka);color:var(--tinta)}
.r.angka.lalu .d{color:var(--pudar)}
.r.slot{height:var(--h-slot)}
.r .j{font:650 calc(var(--h-slot)*.86)/1 var(--font-angka);color:var(--biru);padding-left:10px}
.r.slot.garis{background:linear-gradient(var(--merah),var(--merah)) 54% 100%/40% 2px no-repeat}
.pasang{background:var(--biru-lembut);border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--biru)}
.kursor{display:inline-block;width:.62em;height:3px;background:var(--biru);vertical-align:middle;animation:kedip 1s steps(1) infinite}
@keyframes kedip{50%{opacity:0}}

/* Layar tes */
#layar-tes{position:fixed;inset:0;z-index:50;background:var(--kertas);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
.tes-kepala{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px}
.tes-judul{display:flex;align-items:center;gap:8px;font:700 13px var(--font-angka);letter-spacing:.14em}
.tes-kanan{display:flex;align-items:center;gap:6px}
.tes-posisi{font:600 14px var(--font-angka);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--garis-tipis)}
.bar i{display:block;height:100%;width:0;background:var(--pudar)}
.bar.bagian{height:5px}
.bar.bagian i{background:var(--biru)}
.strip-wadah{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.strip-wadah .strip{-webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
.kosong{visibility:hidden}
.penuh{position:absolute;top:12px;left:16px;right:16px;text-align:center;font-size:13.5px;color:var(--pudar)}
.aba{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:var(--kertas);opacity:.95;font:800 clamp(44px,13vw,76px)/1 var(--font-judul);font-stretch:125%;letter-spacing:.04em;color:var(--merah)}
.aba.hitung{color:var(--tinta);font-size:clamp(72px,22vw,120px)}
.aba.garis{background:none;opacity:1;align-items:flex-start;padding-top:8px;font-size:22px;letter-spacing:.2em}
.aba.garis span{background:var(--merah);color:var(--kertas);padding:8px 14px;border-radius:8px}
.aba.selesai{color:var(--biru)}
.aba.muncul{animation:muncul .45s ease-out}
@keyframes muncul{from{transform:scale(1.12);opacity:0}}
.arah{text-align:center;font:500 12px var(--font-angka);color:var(--pudar);padding:4px 0 2px}
.papan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px;margin:0 auto;padding:8px 16px 14px}
.papan button{height:clamp(46px,8.4vh,62px);font:600 26px/1 var(--font-angka);background:var(--lembar);color:var(--tinta);border:1px solid var(--garis);border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.papan button.ditekan{background:var(--biru-lembut);border-color:var(--biru)}
.papan .koreksi{font:650 14px var(--font-isi);color:var(--merah)}
.papan .nol{grid-column:span 2}
@media (max-height:620px){
  #layar-tes .strip{--h-angka:34px;--h-slot:22px}
  .papan button{height:44px;font-size:22px}
}

/* Admin */
.tab{display:flex;gap:2px;border-bottom:1px solid var(--garis);overflow-x:auto;scrollbar-width:none}
.tab button{font:600 14px var(--font-isi);padding:11px 12px;border:0;background:none;color:var(--pudar);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--biru)}
#isi-tab{display:flex;flex-direction:column;gap:16px}
.saring{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--garis);border-radius:8px;overflow:hidden;background:var(--lembar)}
.seg button{font:600 13.5px var(--font-isi);padding:9px 12px;border:0;border-left:1px solid var(--garis);background:none;color:var(--pudar);cursor:pointer;min-height:40px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--biru-lembut);color:var(--biru)}
.cari{flex:1 1 220px;min-width:0}
.hitung{font-size:13px;color:var(--pudar)}
.daftar{display:flex;flex-direction:column;border:1px solid var(--garis);border-radius:12px;background:var(--lembar);overflow:hidden}
.butir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--garis-tipis);text-align:left;width:100%;background:none;font:inherit;color:inherit}
.butir:first-child{border-top:0}
button.butir{cursor:pointer}
button.butir:hover{background:var(--kertas)}
.butir .kiri{display:flex;flex-direction:column;gap:3px;min-width:0}
.butir .nama{font-weight:650;overflow-wrap:anywhere}
.butir .sub{font-size:13px;color:var(--pudar)}
.butir .kanan{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.butir .metrik{font:500 13px var(--font-angka);font-variant-numeric:tabular-nums;white-space:nowrap}
.aksi-kecil{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){
  .butir{grid-template-columns:1fr}
  .butir .kanan{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
}
.kosong-isi{padding:28px 20px;text-align:center;color:var(--pudar);border:1px dashed var(--garis);border-radius:12px}
.dua-kolom{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.dua-kolom{grid-template-columns:minmax(0,1fr)}}
.tabel-wadah{overflow-x:auto;border:1px solid var(--garis);border-radius:12px;background:var(--lembar)}
.tabel{width:100%;border-collapse:collapse;font-size:14px}
.tabel th{font:600 12px var(--font-isi);color:var(--pudar);text-align:left;padding:10px 14px;border-bottom:1px solid var(--garis);white-space:nowrap}
.tabel td{padding:11px 14px;border-bottom:1px solid var(--garis-tipis);vertical-align:middle}
.tabel tr:last-child td{border-bottom:0}
.tabel .angka{font-family:var(--font-angka);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabel .satuan{color:var(--pudar);font-size:12px;font-family:var(--font-isi)}
.tabel .sub-skor{display:block;font:500 12px var(--font-angka);color:var(--pudar);margin-top:2px}
@media (max-width:520px){.tabel th,.tabel td{padding:10px}.tabel .satuan{display:block}}
.detail-kepala{display:flex;flex-direction:column;gap:8px}
.meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--pudar)}
.angka-ringkas{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:13px;color:var(--pudar)}
.angka-ringkas b{font:600 14px var(--font-angka);color:var(--tinta);font-variant-numeric:tabular-nums}
.grafik svg{width:100%;height:auto;display:block}
.g-grid{stroke:var(--garis-tipis);stroke-width:1}
.g-label{fill:var(--pudar);font:11px var(--font-angka)}
.g-area{fill:var(--biru);opacity:.08}
.g-garis{fill:none;stroke:var(--biru);stroke-width:2;stroke-linejoin:round}
.g-titik{fill:var(--lembar);stroke:var(--biru);stroke-width:1.6}
.g-batang{fill:var(--biru);opacity:.85}
.g-rata{stroke:var(--pudar);stroke-width:1.3;stroke-dasharray:4 4}
.g-tren{stroke:var(--merah);stroke-width:1.6;stroke-dasharray:7 4}
.g-ekstrem{fill:none;stroke:var(--tinta);stroke-width:1.2}
.legenda{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--pudar);margin-top:8px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{display:inline-block;width:18px;height:0;border-top:2px solid var(--biru)}
.legenda i.rata{border-top:2px dashed var(--pudar)}
.legenda i.tren{border-top:2px dashed var(--merah)}
.legenda i.lingkar{width:10px;height:10px;border:1.2px solid var(--tinta);border-radius:50%}
.interp{display:flex;flex-direction:column;gap:14px}
.interp-baris{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--garis-tipis)}
.interp-baris:last-of-type{border-bottom:0;padding-bottom:0}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedBaru() {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 2147483646) + 1; }
  catch (e) { return Math.floor(Math.random() * 2147483646) + 1; }
}
function lembarKraepelin(seed, jumlahLajur, angkaPerLajur) {
  const r = mulberry32(seed), L = [];
  for (let c = 0; c < jumlahLajur; c++) {
    const col = [];
    for (let i = 0; i < angkaPerLajur; i++) col.push(1 + Math.floor(r() * 9));
    L.push(col);
  }
  return L;
}
function deretPauli(seed) {

  return function (i) { while (d.length <= i) d.push(1 + Math.floor(r() * 9)); return d[i]; };
}
const kunci = (a, b) => (a + b) % 10;
const jumlahPeriode = c => Math.max(1, Math.round(c.durasiMenit / c.menitPerPeriode));
const durasiMs = t => t.tes === 'kraepelin' ? t.cfg.jumlahLajur * t.cfg.detikPerLajur * 1000 : Math.round(t.cfg.durasiMenit * 60000);

const rata = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
function regresi(ys) {
  const n = ys.length;
  if (n < 2) return { a: ys[0] || 0, b: 0 };
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { const x = i + 1; sx += x; sy += ys[i]; sxx += x * x; sxy += x * ys[i]; }
  const b = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  return { a: (sy - b * sx) / n, b };
}

// Kraepelin: tinggi lajur = jumlah penjumlahan yang dikerjakan pada lajur itu.
function skorKraepelin(seed, cfg, jawaban, pembetulan) {
  const L = lembarKraepelin(seed, cfg.jumlahLajur, cfg.angkaPerLajur);
  const lajur = L.map((col, c) => {
    const ans = jawaban[c] || [];
    let s = 0;
    for (let j = 0; j < ans.length; j++) if (ans[j] !== kunci(col[j], col[j + 1])) s++;
    return { t: ans.length, s, p: (pembetulan && pembetulan[c]) || 0 };
  });
  const T = lajur.map(x => x.t), n = T.length;
  const reg = regresi(T);
  const total = T.reduce((a, b) => a + b, 0);
  const salah = lajur.reduce((a, x) => a + x.s, 0);
  return {
    panker: bulat(total / n),                 // kecepatan: rata-rata tinggi lajur
    tianker: salah,                           // ketelitian: jumlah salah (tidak ada lompatan di versi online)
    janker: Math.max(...T) - Math.min(...T),  // keajegan: selisih lajur tertinggi dan terendah
    hanker: bulat(reg.b * (n - 1)),           // ketahanan: perubahan garis regresi dari lajur pertama ke terakhir
    totalDikerjakan: total, totalSalah: salah,
    pembetulan: lajur.reduce((a, x) => a + x.p, 0), lajur

}

// Pauli: batas[p] = jumlah jawaban kumulatif saat periode p berakhir (tanda garis).
function skorPauli(seed, cfg, jawaban, batas, pembetulan) {
  const get = deretPauli(seed), P = jumlahPeriode(cfg), periode = [];
  let awal = 0;
  for (let p = 0; p < P; p++) {
    const akhir = batas[p] == null ? awal : batas[p];
    let s = 0;
    for (let i = awal; i < akhir; i++) if (jawaban[i] !== kunci(get(i), get(i + 1))) s++;
    periode.push({ n: akhir - awal, s, p: (pembetulan && pembetulan[p]) || 0 });
    awal = akhir;
  }
  const N = periode.map(x => x.n);
  const total = N.reduce((a, b) => a + b, 0);
  const rr = total / P;
  const totalSalah = periode.reduce((a, x) => a + x.s, 0);
  const penyimpangan = rata(N.map(x => Math.abs(x - rr)));
  const k = Math.max(1, Math.floor(P / 3));
  const awalM = rata(N.slice(0, k)), akhirM = rata(N.slice(P - k));
  return {
    total, rataRata: bulat(rr), totalSalah,
    persenSalah: total ? bulat(totalSalah / total * 100) : 0,
    pembetulan: periode.reduce((a, x) => a + x.p, 0),
    penyimpangan: bulat(penyimpangan),
    persenPenyimpangan: rr ? bulat(penyimpangan / rr * 100) : 0,
    tren: awalM ? bulat((akhirM - awalM) / awalM * 100) : 0, // % perubahan sepertiga akhir terhadap sepertiga awal
    periode
  };
}

// Nilai yang dibandingkan dengan norma; hasil uji coba disetarakan ke durasi penuh.
function nilaiNorma(tes, h, mode, penuh) {
  if (tes === 'kraepelin') {
    const n = +h.jumlahLajur || penuh.kraepelin.jumlahLajur;
    const sk = mode === 'Penuh' ? 1 : penuh.kraepelin.jumlahLajur / n;
    return { panker: +h.panker, tianker: (+h.tianker) * sk, janker: +h.janker, hanker: +h.hanker };
  }
  const dur = +h.durasiMenit || penuh.pauli.durasiMenit;
  return { total: (+h.total) * penuh.pauli.durasiMenit / dur, persenSalah: +h.persenSalah, persenPenyimpangan: +h.persenPenyimpangan, tren: +h.tren };
}
function levelDari(v, n) {
  const b = n.batas.map(Number);
  if (isNaN(v) || b.some(isNaN)) return null;
  if (n.arah === 'turun') return v <= b[0] ? 4 : v <= b[1] ? 3 : v <= b[2] ? 2 : v <= b[3] ? 1 : 0;
  return v < b[0] ? 0 : v < b[1] ? 1 : v < b[2] ? 2 : v < b[3] ? 3 : 4;
}
function hitungKategori(tes, h, mode, norma, penuh) {
  const nilai = nilaiNorma(tes, h, mode, penuh);
  return ASPEK[tes].map(a => {
    const n = norma.find(r => r.tes === tes && r.aspek === a.key);
    const level = n ? levelDari(nilai[a.key], n) : null;
    return { aspek: a.key, nama: a.nama, nilai: nilai[a.key], level, label: level === null ? 'Norma belum diisi' : LEVEL[level] };
  });
}

function simulasiKraepelin(seed, cfg, r) {
  const L = lembarKraepelin(seed, cfg.jumlahLajur, cfg.angkaPerLajur), jaw = [], pem = [];
  for (let c = 0; c < cfg.jumlahLajur; c++) {
    let h = Math.round(13 + 1.6 * Math.sin(c / 3.5) + (r() - 0.5) * 2.6 - c * 0.04);
    h = Math.max(4, Math.min(cfg.angkaPerLajur - 1, h));
    const a = [];
    for (let j = 0; j < h; j++) { const k = kunci(L[c][j], L[c][j + 1]); a.push(r() < 0.99 ? k : (k + 1 + Math.floor(r() * 8)) % 10); }

  }

}
function simulasiPauli(seed, cfg, r) {
  const get = deretPauli(seed), P = jumlahPeriode(cfg), jaw = [], batas = [], pem = [];
  for (let p = 0; p < P; p++) {
    const n = Math.round(128 + 9 * Math.sin(p / 2.6) + (r() - 0.5) * 14 - p * 0.9);

async function demoApi(aksi, d) {
  await new Promise(r => setTimeout(r, 120));
  const db = Demo.muat();
  const sesi = () => { const s = db.sesi[d.token]; if (!s) throw galat('Sesi berakhir. Silakan masuk lagi.', 'SESI'); return s; };
  const admin = () => { const s = sesi(); if (s.role !== 'admin') throw galat('Hanya admin yang boleh melakukan ini.'); return s; };
  const cari = u => db.users.find(x => x.username === String(u || '').trim().toLowerCase());
  const publik = u => ({ username: u.username, nama: u.nama, role: u.role });
  const selesai = u => ['kraepelin', 'pauli'].filter(t => db.hasil[t].some(h => h.username === u && h.mode === 'Penuh'));
  switch (aksi) {
    case 'login': {
      const u = cari(d.username);
      if (!u || u.password !== String(d.password || '')) throw galat('Username atau password salah.');
      if (!u.aktif) throw galat('Akun ini dinonaktifkan. Hubungi admin.');
      const token = 'demo-' + seedBaru() + '-' + Date.now();
      db.sesi[token] = publik(u); Demo.simpan();
      return { token, user: publik(u), pengaturan: PENGATURAN_DEMO, selesai: selesai(u.username) };
    }
    case 'sesi': { const s = sesi(); return { user: s, pengaturan: PENGATURAN_DEMO, selesai: selesai(s.username) }; }
    case 'logout': { delete db.sesi[d.token]; Demo.simpan(); return {}; }
    case 'gantiPassword': {
      const u = cari(sesi().username);
      if (u.password !== String(d.lama || '')) throw galat('Password lama tidak cocok.');
      if (String(d.baru || '').length < 6) throw galat('Password baru minimal 6 karakter.');
      u.password = String(d.baru); Demo.simpan(); return {};
    }
    case 'simpanHasil': {
      const s = sesi(), tes = d.tes, h = d.hasil || {};
      if (!db.hasil[tes]) throw galat('Jenis tes tidak dikenal.');
      const mode = h.mode === 'Uji coba' ? 'Uji coba' : 'Penuh';
      if (mode === 'Penuh' && s.role !== 'admin' && !PENGATURAN_DEMO.izinUlang && selesai(s.username).includes(tes)) throw galat('Anda sudah menyelesaikan tes ini.', 'DUPLIKAT');
      const rek = buatRekam(tes, h, s, mode, NORMA_AWAL, PENGATURAN_DEMO);
      db.hasil[tes].push(rek); Demo.simpan();
      const tampil = PENGATURAN_DEMO.tampilkanHasilKePeserta || s.role === 'admin';
      return { id: rek.id, kategori: tampil ? hitungKategori(tes, rek, mode, NORMA_AWAL, PENGATURAN_DEMO) : null };
    }
    case 'daftarHasil': {
      admin();
      const out = [];
      for (const t of ['kraepelin', 'pauli']) for (const h of db.hasil[t]) { const o = Object.assign({ tes: t }, h); delete o.data; delete o.jawaban; out.push(o); }
      return { hasil: out };
    }
    case 'detailHasil': {
      admin();
      const h = (db.hasil[d.tes] || []).find(x => x.id === d.id);
      if (!h) throw galat('Hasil tidak ditemukan.');
      return { hasil: Object.assign({ tes: d.tes }, h) };
    }
    case 'simpanReview': {
      const s = admin(), h = (db.hasil[d.tes] || []).find(x => x.id === d.id);
      if (!h) throw galat('Hasil tidak ditemukan.');
      h.status = d.status === 'Sudah direview' ? 'Sudah direview' : 'Draf';
      h.catatan = String(d.catatan || ''); h.reviewer = s.nama; h.waktuReview = new Date().toISOString();
      Demo.simpan();
      return { reviewer: h.reviewer, waktuReview: h.waktuReview };
    }
    case 'daftarUser': { admin(); return { users: db.users.map(u => ({ username: u.username, nama: u.nama, role: u.role, aktif: u.aktif, dibuat: u.dibuat })) }; }
    case 'tambahUser': {
      admin();
      const username = String(d.username || '').trim().toLowerCase(), nama = String(d.nama || '').trim(), password = String(d.password || '');
      const salah = cekAkun(username, nama, password); if (salah) throw galat(salah);
      if (cari(username)) throw galat('Username sudah dipakai.');
      db.users.push({ username, nama, role: d.role === 'admin' ? 'admin' : 'peserta', aktif: true, password, dibuat: new Date().toISOString() });
      Demo.simpan(); return {};
    }
    case 'ubahUser': {
      const s = admin(), u = cari(d.username);
      if (!u) throw galat('Akun tidak ditemukan.');
      if (typeof d.aktif === 'boolean') {
        if (u.username === s.username && !d.aktif) throw galat('Anda tidak bisa menonaktifkan akun sendiri.');
        u.aktif = d.aktif;
      }
      if (d.passwordBaru) { if (String(d.passwordBaru).length < 6) throw galat('Password minimal 6 karakter.'); u.password = String(d.passwordBaru); }
      Demo.simpan(); return {};
    }
    case 'norma': { admin(); return { norma: NORMA_AWAL }; }
  }
  throw galat('Aksi tidak dikenal.');
}

    if (o.ekstrem) {
      const iMax = nilai.indexOf(Math.max(...nilai)), iMin = nilai.indexOf(Math.min(...nilai));
      [iMax, iMin].forEach(i => { g += `<circle class="g-ekstrem" cx="${f1(x(i))}" cy="${f1(y(nilai[i]))}" r="7"/>`; });
    }
  }
  const rr = rata(nilai), reg = regresi(nilai);
  g += `<line class="g-rata" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(rr))}" y2="${f1(y(rr))}"/>`;
  g += `<line class="g-tren" x1="${f1(x(0))}" x2="${f1(x(n - 1))}" y1="${f1(y(reg.a + reg.b))}" y2="${f1(y(reg.a + reg.b * n))}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg>`;
}
async function vDetail(tes, id) {

  const K = tes === 'kraepelin';

  const nilai = data.map(x => K ? x.t : x.n);
  const satuan = K ? 'Lajur' : 'Periode';
  const ringkas = K
    ? [['Total dikerjakan', fmt(h.totalDikerjakan, 0)], ['Total salah', fmt(h.totalSalah, 0)], ['Pembetulan', fmt(h.pembetulan, 0)], ['Lajur', `${fmt(h.jumlahLajur, 0)} × ${fmt(h.detikPerLajur, 0)} dtk`]]
    : [['Rata-rata per periode', fmt(h.rataRata, 1)], ['Total salah', fmt(h.totalSalah, 0)], ['Pembetulan', fmt(h.pembetulan, 0)], ['Durasi', `${durasiTeks(+h.durasiMenit)} · garis tiap ${durasiTeks(+h.menitPerPeriode)}`]];
  const reviewed = h.status === 'Sudah direview';
  render(kepala() + `<main class="wrap">
    <button class="tombol teks" data-aksi="tab" data-tab="hasil" style="align-self:flex-start">← Semua hasil</button>
    <div class="detail-kepala">
      <p class="eyebrow">Hasil ${NAMA_TES[tes]} · ${esc(h.id)}</p>
      <h1>${esc(h.nama)}</h1>
      <div class="meta"><span>${esc(h.username)}</span><span>Selesai ${fmtTgl(h.selesai)}</span>
        ${h.mode !== 'Penuh' ? `<span class="chip draf">${esc(h.mode)}</span>` : ''}
        <span class="chip ${reviewed ? 'ok' : 'draf'}" id="chip-status">${esc(h.status || 'Draf')}</span></div>
    </div>
    ${h.mode !== 'Penuh' ? notis('Hasil uji coba berdurasi singkat. Skor disetarakan ke durasi penuh dan tidak untuk penilaian.', 'peringatan') : ''}
    <div class="dua-kolom">
      <div class="sisi">
        <div class="tabel-wadah"><table class="tabel">
          <thead><tr><th>Aspek</th><th>Nilai</th><th>Kategori</th></tr></thead>
          <tbody>${ASPEK[tes].map((a, i) => `<tr><td>${a.nama}<span class="sub-skor">${a.skor}</span></td><td class="angka">${fmt(h[a.field], a.d)} <span class="satuan">${a.satuan}</span></td><td><span class="chip ${kat[i].level == null ? '' : 'l' + kat[i].level}">${esc(kat[i].label)}</span></td></tr>`).join('')}</tbody>
        </table></div>
        <div class="angka-ringkas">${ringkas.map(([l, v]) => `<span>${l} <b>${v}</b></span>`).join('')}</div>
        <section class="lembar">
          <h2>Kurva kerja</h2>
          <p class="catatan-kecil" style="margin:4px 0 10px">Jumlah jawaban per ${satuan.toLowerCase()}.</p>
          <div class="grafik">${grafikKurva(nilai, { jenis: K ? 'garis' : 'batang', ekstrem: K, satuan, aria: `Kurva kerja ${NAMA_TES[tes]} ${h.nama}` })}</div>
          <div class="legenda">
            <span><i></i>Jawaban per ${satuan.toLowerCase()}</span>
            <span><i class="rata"></i>Rata-rata${K ? ' (Panker)' : ''}</span>
            <span><i class="tren"></i>Garis tren${K ? ' (Hanker)' : ''}</span>

async function simpanReview(form) {
  const btn = form.querySelector('button[type="submit"]'), p = $('#review-pesan');
  const tes = form.dataset.tes, id = form.dataset.id, status = form.elements.status.value, catatan = form.elements.catatan.value;
  btn.disabled = true;
  try {
    const r = await panggil('simpanReview', { tes, id, status, catatan });
    p.className = 'notis ok'; p.textContent = 'Review tersimpan.'; p.hidden = false;
    $('#review-info').textContent = `Terakhir disimpan oleh ${r.reviewer} · ${fmtTgl(r.waktuReview)}`;
    const chip = $('#chip-status'); if (chip) { chip.textContent = status; chip.className = 'chip ' + (status === 'Sudah direview' ? 'ok' : 'draf'); }
    const x = S.hasil && S.hasil.find(h => h.id === id); if (x) x.status = status;
  } catch (e) {
    if (e.kode === 'SESI') return;
    p.className = 'notis galat'; p.textContent = e.message; p.hidden = false;
  } finally { btn.disabled = false; }
}

/* ---------- Tab peserta ---------- */
function passwordAcak() {
  const huruf = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = ''; const a = new Uint32Array(8);
  try { crypto.getRandomValues(a); } catch (e) { for (let i = 0; i < 8; i++) a[i] = Math.floor(Math.random() * 1e9); }
  for (let i = 0; i < 8; i++) s += huruf[a[i] % huruf.length];
  return s;
}
function kotakSalin(judul, teks) {

}

      ${DEMO ? '' : '<p class="catatan-kecil">Banyak peserta sekaligus? Isi langsung di sheet Users: kolom Username, Nama, Role, dan Password Baru. Password otomatis diamankan saat tab ini dibuka.</p>'}
    </form>

async function tambahUser(form) {
  const E = form.elements, nama = E.nama.value.trim(), username = E.username.value.trim().toLowerCase(), password = E.password.value, role = E.role.value;
  const salah = cekAkun(username, nama, password);
  if (salah) { tabPesertaPesan(notis(salah, 'galat'), form); return; }
  const btn = form.querySelector('button[type="submit"]'); btn.disabled = true;
  try {
    await panggil('tambahUser', { nama, username, password, role });
    await tabPeserta(kotakSalin(`Akun ${nama} dibuat. Sampaikan data masuk ini ke ${role === 'admin' ? 'admin' : 'peserta'}:`, `Username: ${username}  ·  Password: ${password}`));
  } catch (e) { if (e.kode !== 'SESI') tabPesertaPesan(notis(e.message, 'galat'), form); }
  finally { btn.disabled = false; }
}
function tabPesertaPesan(html, form) {
  let p = form.querySelector('.pesan-form');
  if (!p) { p = document.createElement('div'); p.className = 'pesan-form'; form.insertBefore(p, form.children[1]); }
  p.innerHTML = html;
}
async function ubahAktif(username, aktif) {
  try { await panggil('ubahUser', { username, aktif }); await tabPeserta(); }
  catch (e) { if (e.kode !== 'SESI') await tabPeserta(notis(e.message, 'galat')); }
}
async function resetPassword(username) {
  const baru = passwordAcak();
  try { await panggil('ubahUser', { username, passwordBaru: baru }); await tabPeserta(kotakSalin(`Password ${username} direset. Sampaikan password baru ini:`, `Username: ${username}  ·  Password: ${baru}`)); }
  catch (e) { if (e.kode !== 'SESI') await tabPeserta(notis(e.message, 'galat')); }
}

/* ---------- Tab norma & coba ---------- */
function rentang(n) {
  const b = n.batas.map(v => fmt(v, 2));
  if (n.arah === 'turun') return [`> ${b[3]}`, `${b[2]} < x ≤ ${b[3]}`, `${b[1]} < x ≤ ${b[2]}`, `${b[0]} < x ≤ ${b[1]}`, `≤ ${b[0]}`];
  return [`< ${b[0]}`, `${b[0]} – < ${b[1]}`, `${b[1]} – < ${b[2]}`, `${b[2]} – < ${b[3]}`, `≥ ${b[3]}`];
}
async function tabNorma() {
  try { await muatNorma(); } catch (e) { if (e.kode !== 'SESI') isiTab(notis(e.message, 'galat')); return; }
  const contoh = S.norma.some(n => /contoh/i.test(n.ket));
  isiTab(`${contoh ? notis('Norma yang terpasang masih norma CONTOH untuk format online, bukan norma resmi. Ganti angka batasnya dengan norma Anda sendiri.', 'peringatan') : ''}
    <p class="lead">${DEMO ? 'Di mode demo norma memakai nilai contoh bawaan.' : 'Ubah angka batas langsung di sheet <b>Norma</b> pada Google Sheet Anda. Perubahan berlaku untuk hasil baru dan untuk kategori di halaman detail.'}</p>
    ${['kraepelin', 'pauli'].map(tes => `<div class="norma-tes"><h2>${NAMA_TES[tes]}</h2>
      <div class="tabel-wadah"><table class="tabel">
        <thead><tr><th>Aspek</th><th>Skor</th><th>Arah</th>${LEVEL.map(l => `<th>${l}</th>`).join('')}</tr></thead>
        <tbody>${ASPEK[tes].map(a => { const n = S.norma.find(r => r.tes === tes && r.aspek === a.key);
          return `<tr><td>${a.nama}</td><td class="angka">${a.skor}</td><td>${n ? (n.arah === 'turun' ? 'Makin rendah makin baik' : 'Makin tinggi makin baik') : '–'}</td>${n ? rentang(n).map(x => `<td class="angka">${esc(x)}</td>`).join('') : '<td colspan="5">Belum diisi</td>'}</tr>`; }).join('')}</tbody>
      </table></div></div>`).join('')}
    <p class="catatan-kecil">Kraepelin: Panker dan Hanker memakai nilai apa adanya; Tianker disetarakan ke ${S.pengaturan.kraepelin.jumlahLajur} lajur untuk hasil uji coba. Pauli: Total disetarakan ke ${durasiTeks(S.pengaturan.pauli.durasiMenit)}.</p>`);
}
function tabCoba() {
  isiTab(`<p class="lead">Coba alur tes seperti peserta. Hasil Anda tersimpan atas nama akun admin.</p>
    ${saklarSingkat()}
    <div class="kartu-tes">${['kraepelin', 'pauli'].map(kartuTes).join('')}</div>`);
}

/* ---------- Akun ---------- */
function vAkun(pesan) {
  render(kepala() + `<main class="wrap sempit">

    <form class="lembar" data-form="ganti-password" novalidate>
      <h2>Ganti password</h2>
      ${pesan || ''}
      <label class="isian"><span>Password lama</span><input id="p-lama" name="lama" type="password" autocomplete="current-password" required></label>
      <label class="isian"><span>Password baru</span><input id="p-baru" name="baru" type="password" autocomplete="new-password" required><small>Minimal 6 karakter.</small></label>
      <label class="isian"><span>Ulangi password baru</span><input id="p-ulang" name="ulang" type="password" autocomplete="new-password" required></label>
      <button class="tombol utama" type="submit">Simpan password</button>
    </form>
  </main>`);

async function gantiPassword(form) {
  const E = form.elements, lama = E.lama.value, baru = E.baru.value, ulang = E.ulang.value;
  if (baru.length < 6) return vAkun(notis('Password baru minimal 6 karakter.', 'galat'));
  if (baru !== ulang) return vAkun(notis('Ulangan password baru tidak sama.', 'galat'));
  try { await panggil('gantiPassword', { lama, baru }); vAkun(notis('Password berhasil diganti.', 'ok')); }
  catch (e) { if (e.kode !== 'SESI') vAkun(notis(e.message, 'galat')); }
}

/* ================= Peristiwa ================= */
const AKSI = {
  'masuk-demo': el => masuk(el.dataset.u, el.dataset.p),
  'keluar': async () => { try { await api('logout'); } catch (e) { /* tetap keluar */ } keluarLokal(); },
  'akun': () => vAkun(),
  'beranda': () => keBeranda(),
  'tab': el => vAdmin(el.dataset.tab),
  'saring-tes': el => { S.filterTes = el.dataset.v; document.querySelectorAll('[data-aksi="saring-tes"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.filterTes)); gambarDaftarHasil(); },
  'muat-ulang': () => { S.hasil = null; isiTab('<p class="memuat">Memuat…</p>'); tabHasil(); },
  'buka-hasil': el => vDetail(el.dataset.tes, el.dataset.id),
  'petunjuk': el => vInstruksi(el.dataset.tes),
  'latihan': el => mulaiTes(el.dataset.tes, 'latihan'),
  'tanya-mulai': () => { const k = $('#konfirmasi'); if (k) { k.hidden = false; k.scrollIntoView({ behavior: 'smooth', block: 'center' }); } },
  'batal-mulai': () => { const k = $('#konfirmasi'); if (k) k.hidden = true; },
  'mulai': el => { if (!$('#f-setuju') || !$('#f-setuju').checked) return; mulaiTes(el.dataset.tes, jenisTes()); },
  'hentikan-latihan': () => hentikanLatihan(),
  'lanjutkan-tes': () => { const pg = bacaLokal('psikotes_progres'); if (pg && S.user && pg.user === S.user.username) mulaiTes(pg.tes, pg.jenis, pg); else keBeranda(); },
  'kirim-ulang': () => { const td = bacaLokal('psikotes_tertunda'); if (td && S.user && td.user === S.user.username) kirimHasil(td); else keBeranda(); },
  'masuk-ulang': () => keluarLokal({ teks: 'Masuk lagi untuk mengirim hasil tes yang tersimpan di perangkat ini.', jenis: 'peringatan' }),
  'buat-password': () => { const f = $('#u-password'); if (f) f.value = passwordAcak(); },
  'ubah-aktif': el => ubahAktif(el.dataset.u, el.dataset.v === '1'),
  'reset-tanya': el => { const box = $('#aksi-' + CSS.escape(el.dataset.u)); if (box) box.innerHTML = `<span class="catatan-kecil">Reset password?</span><button class="tombol teks kecil" data-aksi="reset-ya" data-u="${esc(el.dataset.u)}">Ya, reset</button><button class="tombol teks kecil" data-aksi="reset-batal">Batal</button>`; },
  'reset-ya': el => resetPassword(el.dataset.u),
  'reset-batal': () => tabPeserta(),
  'salin': el => {
    const teks = el.dataset.teks;
    const pilih = () => { const c = el.parentElement.querySelector('code'); if (c) { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } el.textContent = 'Tekan salin di perangkat'; };
    try { navigator.clipboard.writeText(teks).then(() => { el.textContent = 'Tersalin'; }, pilih); } catch (e) { pilih(); }
  }
};
const FORM = {
  'masuk': f => masuk(f.elements.username.value.trim().toLowerCase(), f.elements.password.value),
  'review': f => simpanReview(f),
  'tambah-user': f => tambahUser(f),
  'ganti-password': f => gantiPassword(f)
};
const UBAH = {
  'singkat': el => { S.singkat = el.checked; if (S.user.role === 'admin') tabCoba(); else vBeranda(); },
  'setuju': el => { const b = $('#tombol-mulai'); if (b) b.disabled = !el.checked; }
};
document.addEventListener('click', e => {
  const k = e.target.closest('#layar-tes [data-k]');
  if (k) { if (e.detail === 0) tekanTombol(k); return; } // klik dari keyboard; sentuhan/mouse ditangani pointerdown
  const el = e.target.closest('[data-aksi]'); if (!el) return;
  const f = AKSI[el.dataset.aksi]; if (!f) return;
  e.preventDefault(); f(el, e);
});
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#layar-tes [data-k]'); if (!b) return;
  e.preventDefault(); tekanTombol(b);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const h = FORM[f.dataset.form]; if (h) h(f);
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.input === 'cari') { S.cari = e.target.value; gambarDaftarHasil(); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-ubah]'); if (el && UBAH[el.dataset.ubah]) UBAH[el.dataset.ubah](el); });
document.addEventListener('keydown', e => {
  if (!T || T.berhenti || $('#layar-tes').hidden || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  let k = null;
  if (/^[0-9]$/.test(e.key)) k = e.key; else if (e.key === 'Backspace' || e.key === 'Delete') k = 'koreksi';
  if (k === null) return;
  e.preventDefault();
  const b = $(`#layar-tes [data-k="${k}"]`); if (b) tekanTombol(b); else tekan(k);
});
document.addEventListener('visibilitychange', () => {
  if (!T || T.berhenti) return;
  if (document.hidden) simpanProgres(true); else mintaWakeLock();
});
window.addEventListener('beforeunload', e => {
  if (T && !T.berhenti && T.jenis !== 'latihan') { simpanProgres(true); e.preventDefault(); e.returnValue = ''; }
});

(async function init() {
  const tok = bacaLokal('psikotes_token');
  if (tok) {
    S.token = tok;
    try { terimaSesi(await api('sesi')); keBeranda(); return; }
    catch (e) { S.token = null; simpanLokal('psikotes_token', null); }
  }
  vLogin();
})();
</script>
